name: Convert card definitions

on:
  push:
    paths:
      - forceteki
      - bot/card-compiler/**
      - bot/omni-rs/**
      - bot/omni-wasm/**
      - bot/omni/wasm/**
      - bot/omni/rs/**
      - bot/rust/src/cards.rs
      - tools/card-runtime-report.js
      - Cargo.lock
      - package.json
      - .github/workflows/card-conversion.yml
  pull_request:
    paths:
      - forceteki
      - bot/card-compiler/**
      - bot/omni-rs/**
      - bot/omni-wasm/**
      - bot/omni/wasm/**
      - bot/omni/rs/**
      - bot/rust/src/cards.rs
      - tools/card-runtime-report.js
      - Cargo.lock
      - package.json
      - .github/workflows/card-conversion.yml
  schedule:
    - cron: '17 11 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cards-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Install the pinned engine parser and fetch card metadata
        run: |
          npm --prefix forceteki ci --ignore-scripts
          npm --prefix forceteki run get-cards
      - name: Generate every known card and validate supported behavior
        run: |
          npm run cards:compile
          npm run cards:test
          cargo test --locked --workspace
          npm run cards:check
      - name: Build and test the same programs in WebAssembly
        run: |
          npm run wasm:build -- --install-tools
          npm run wasm:test
          npm run wasm:pack
          npm run wasm:pack:check
      - name: Capture generated changes
        run: git diff --binary -- bot/card-compiler/generated > card-conversion.patch
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: card-conversion-${{ github.run_id }}
          path: |
            bot/card-compiler/generated/
            bot/omni-wasm/pkg/distribution/*.tgz
            bot/omni-wasm/pkg/distribution/receipt.json
            card-conversion.patch
          if-no-files-found: error
