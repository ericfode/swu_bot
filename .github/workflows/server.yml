# The arena server's checks (server/, TypeScript on Effect): its tests and the typecheck. Runs only when the server
# changes. Nothing deploys the server yet.
name: Server
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'
  pull_request:
    paths:
      - 'server/**'
      - '.github/workflows/server.yml'

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
