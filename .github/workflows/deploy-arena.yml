# Builds the arena image (Dockerfile) on Fly's builders and rolls it out to swu-arena (fly.toml) after the window's
# tests pass. Needs the repository secret FLY_API_TOKEN (`fly tokens create deploy -a swu-arena`).
name: Deploy the arena
on:
  push:
    branches: [main]
    paths:
      - 'bot/arena/**'
      - 'app/**'
      - 'studio/**'
      - 'dashboard/site/**'
      - 'meta/atlas-kit.js'
      - 'Dockerfile'
      - '.dockerignore'
      - 'fly.toml'
      - '.github/workflows/deploy-arena.yml'
  workflow_dispatch:

concurrency:
  group: deploy-arena
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test bot/test/window.test.js app/test/*.test.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      # until the deploy token is added, merges run the tests and deploy nothing
      - if: env.FLY_API_TOKEN == ''
        run: echo "::notice::FLY_API_TOKEN is not set, so nothing was deployed"
      - if: env.FLY_API_TOKEN != ''
        uses: actions/checkout@v4
      - if: env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      - if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only
