# Builds the games image (Dockerfile.games) on Fly's builders and rolls it out to swu-arena-games (fly.games.toml) after
# the arena tests pass. Pull requests that touch the same files run the tests only. Needs the repository secret FLY_GAMES_TOKEN (`fly tokens create deploy -a swu-arena-games`).
# The image builds forceteki from the submodule: when that repository is private, FORCETEKI_TOKEN (a token that can
# read it) checks it out; otherwise the workflow's own token does.
name: Deploy the games machine
on:
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - 'coord/**'
      - 'forceteki'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'Dockerfile.games'
      - 'Dockerfile.games.dockerignore'
      - 'fly.games.toml'
      - '.github/workflows/deploy-games.yml'
  pull_request:
    paths:
      - 'bot/arena/**'
      - 'bot/test/gamesctl-plan.test.js'
      - 'bot/test/gamesctl.test.js'
      - 'bot/test/arena-hardening.test.js'
      - 'bot/test/remote-lane.test.js'
      - 'bot/test/play-seed.test.js'
      - 'bot/test/bundle.test.js'
      - 'bot/remote-lane.js'
      - 'bot/ladder.js'
      - 'bot/ladder-worker.js'
      - 'bot/game-pool.js'
      - 'bot/compiled/bundle.py'
      - 'coord/**'
      - 'Dockerfile.games'
      - 'fly.games.toml'
      - '.github/workflows/deploy-games.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('games-test-{0}', github.ref) || 'deploy-games' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      # play-seed's games need the engine, which this job does not build: those tests skip, the job checks stay
      - run: node --test bot/test/gamesctl-plan.test.js bot/test/gamesctl.test.js bot/test/arena-hardening.test.js bot/test/window.test.js bot/test/remote-lane.test.js bot/test/play-seed.test.js bot/test/bundle.test.js

  # the Elixir coordinator (coord/): the versions Dockerfile.games builds with; the :node tests call the real gamesctl.js
  test-coord:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: coord
    env:
      MIX_ENV: test
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - uses: erlef/setup-beam@v1
        with:
          otp-version: '28.5.0.7'
          elixir-version: '1.19.6'
          version-type: strict
      - uses: actions/cache@v5
        with:
          path: |
            coord/deps
            coord/_build
          key: coord-${{ runner.os }}-28.5.0.7-1.19.6-${{ hashFiles('coord/mix.lock') }}
      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix format --check-formatted
      - run: mix test --include node

  deploy:
    needs: [test, test-coord]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_GAMES_TOKEN }}
    steps:
      # until the deploy token is added, merges run the tests and deploy nothing
      - if: env.FLY_API_TOKEN == ''
        run: echo "::notice::FLY_GAMES_TOKEN is not set, so the games machine was not deployed"
      - if: env.FLY_API_TOKEN != ''
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # the engine at the commit this repo pins; FORCETEKI_TOKEN replaces the workflow's token for it when set
      - if: env.FLY_API_TOKEN != ''
        env:
          TOKEN: ${{ secrets.FORCETEKI_TOKEN || github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c 'http.https://github.com/.extraheader=' -c "http.https://github.com/.extraheader=$auth" submodule update --init --depth 1 forceteki \
            || git -c 'http.https://github.com/.extraheader=' -c "http.https://github.com/.extraheader=$auth" submodule update --init forceteki
          git -C forceteki log -1 --format='forceteki %h %s'
      - if: env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      # the image is tagged with the commit, so a helper pulls exactly what the machine runs (bot/arena/HELPER.md)
      - if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only -c fly.games.toml --build-arg GIT_SHA=${{ github.sha }} --image-label ${{ github.sha }}
