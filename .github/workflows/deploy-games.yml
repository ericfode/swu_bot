# Builds the games image (Dockerfile.games) on Fly's builders and rolls it out to swu-arena-games (fly.games.toml) after
# the arena's and the server's tests pass (the arena server's games role runs the machine: server/README.md). Pull
# requests that touch the same files run the tests, and build the image when they change how it is built; they never
# deploy. Needs the repository secret FLY_GAMES_TOKEN (`fly tokens create deploy -a swu-arena-games`).
# The image builds forceteki from the submodule: when that repository is private, FORCETEKI_TOKEN (a token that can
# read it) checks it out; otherwise the workflow's own token does.
name: Deploy the games machine
on:
  push:
    branches: [main]
    paths:
      - 'bot/**'
      - 'server/**'
      - 'forceteki'
      - 'vendor/kessel/**'
      - 'Dockerfile.games'
      - 'Dockerfile.games.dockerignore'
      - 'fly.games.toml'
      - '.github/workflows/deploy-games.yml'
  pull_request:
    paths:
      - 'bot/arena/**'
      - 'bot/test/gamesctl-plan.test.js'
      - 'bot/test/gamesctl.test.js'
      - 'bot/test/arena-hardening.test.js'
      - 'bot/test/remote-lane.test.js'
      - 'bot/test/play-seed.test.js'
      - 'bot/test/bundle.test.js'
      - 'bot/test/sims.test.js'
      - 'bot/test/helper-sh.test.js'
      - 'bot/sims/**'
      - 'vendor/kessel/**'
      - 'bot/remote-lane.js'
      - 'bot/ladder.js'
      - 'bot/ladder-worker.js'
      - 'bot/game-pool.js'
      - 'bot/compiled/bundle.py'
      - 'server/**'
      - 'Dockerfile.games'
      - 'Dockerfile.games.dockerignore'
      - 'fly.games.toml'
      - '.github/workflows/deploy-games.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.event_name == 'pull_request' && format('games-test-{0}', github.ref) || 'deploy-games' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      # play-seed's and sims' games need the engine, which this job does not build: those tests skip, the job checks and
      # the vendored Kessel package's checks stay
      - run: node --test bot/test/gamesctl-plan.test.js bot/test/gamesctl.test.js bot/test/arena-hardening.test.js bot/test/window.test.js bot/test/remote-lane.test.js bot/test/play-seed.test.js bot/test/bundle.test.js bot/test/sims.test.js bot/test/helper-sh.test.js

  # the arena server, whose games role runs the machine (server/src/main-games.ts): its typecheck and tests. Their real
  # games need the engine, which this job does not build either: those skip, as in the test job above
  test-server:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test

  # The image itself, on a pull request that changes how it is built, so a Dockerfile that does not build shows before
  # the merge and not in the deploy. Built on the runner and thrown away; the deploy builds its own on Fly's builders.
  image:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          # the merge commit and its parents, to see what the pull request changes
          fetch-depth: 2
          persist-credentials: false
      - name: What the change touches
        id: changed
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(Dockerfile\.games(\.dockerignore)?|fly\.games\.toml|server/package(-lock)?\.json|\.github/workflows/deploy-games\.yml)$'; then
            echo "image=true" >> "$GITHUB_OUTPUT"
          else
            echo "image=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.changed.outputs.image == 'true'
        env:
          TOKEN: ${{ secrets.FORCETEKI_TOKEN || github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c 'http.https://github.com/.extraheader=' -c "http.https://github.com/.extraheader=$auth" submodule update --init --depth 1 forceteki \
            || git -c 'http.https://github.com/.extraheader=' -c "http.https://github.com/.extraheader=$auth" submodule update --init forceteki
      - if: steps.changed.outputs.image == 'true'
        run: docker build -f Dockerfile.games -t swu-arena-games:check .

  deploy:
    needs: [test, test-server]
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_GAMES_TOKEN }}
    steps:
      # until the deploy token is added, merges run the tests and deploy nothing
      - if: env.FLY_API_TOKEN == ''
        run: echo "::notice::FLY_GAMES_TOKEN is not set, so the games machine was not deployed"
      - if: env.FLY_API_TOKEN != ''
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      # the engine at the commit this repo pins; FORCETEKI_TOKEN replaces the workflow's token for it when set
      - if: env.FLY_API_TOKEN != ''
        env:
          TOKEN: ${{ secrets.FORCETEKI_TOKEN || github.token }}
        run: |
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)"
          git -c 'http.https://github.com/.extraheader=' -c "http.https://github.com/.extraheader=$auth" submodule update --init --depth 1 forceteki \
            || git -c 'http.https://github.com/.extraheader=' -c "http.https://github.com/.extraheader=$auth" submodule update --init forceteki
          git -C forceteki log -1 --format='forceteki %h %s'
      - if: env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # 1.6
      # the image is tagged with the commit, so a helper pulls exactly what the machine runs (bot/arena/HELPER.md)
      - if: env.FLY_API_TOKEN != ''
        run: flyctl deploy --remote-only -c fly.games.toml --build-arg GIT_SHA=${{ github.sha }} --image-label ${{ github.sha }}
