[package]
name = "swu-learned"
version = "0.1.0"
edition = "2021"
description = "Tiny learned world + action model bot for swu_bot (Burn), speaks the stdio bot protocol"

[dependencies]
burn = { version = "0.22", default-features = false, features = ["std", "optim", "flex", "store"] }
flate2 = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
debug = false
