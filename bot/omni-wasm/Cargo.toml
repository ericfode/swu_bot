[package]
name = "omni-wasm"
version = "0.1.0"
edition = "2021"
description = "Persistent WebAssembly game handles and complete Rust endgame searches"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
omni-rs = { path = "../omni-rs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "=0.2.129"
web-time = "=1.1.0"
