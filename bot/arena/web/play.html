<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SWU Arena Play</title>
<style>
/* The play page (bot/arena/play.js): Holotable's versus screen (SWUViewer.mountPlay) opens at once with every bot the
   person may play and the deck lists; the rules engine downloads while they choose, and so does the bot they look at.
   The referee and the bot run in a worker of this tab (play-worker.js); a finished game is sent back to the window. */
:root {
  --bg: #060a13; --panel: #0f1829; --line: #1d2a44; --ink: #e6ecf8; --dim: #8494b8;
  --p1: #56c8ff; --p2: #ff5f6d; --gold: #f6c454; --good: #4fe0a8; --bad: #ff7b72;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --display: "Oxanium", "Eurostile", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
.bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: color-mix(in oklab, var(--panel) 88%, transparent); backdrop-filter: blur(8px); }
.brand { font: 600 12px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--dim); text-decoration: none; }
.title { font: 650 17px/1.2 var(--display); }
.grow { flex: 1; }
.status { display: inline-flex; align-items: center; gap: 8px; font: 500 13px/1.3 var(--mono); color: var(--dim); min-width: 0; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
.status[data-tone="good"] i { background: var(--good); box-shadow: 0 0 8px var(--good); }
.status[data-tone="busy"] i { background: var(--p1); animation: pulse 1s ease-in-out infinite alternate; }
.status[data-tone="bad"] i { background: var(--bad); }
.status[data-tone="bad"] { color: var(--ink); }
@keyframes pulse { from { opacity: .35; } to { opacity: 1; } }
button { font: 600 14px/1 var(--sans); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; cursor: pointer; }
button:hover { border-color: color-mix(in oklab, var(--p1) 50%, var(--line)); }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.who { font: 500 13px/1 var(--mono); color: var(--dim); }
#table { min-height: calc(100dvh - 58px); }
#viewer-wrap { padding: 12px 16px 24px; display: grid; gap: 12px; }
#viewer { min-height: calc(100dvh - 140px); }
.panel { max-width: 860px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 18px; }
.panel h2 { margin: 0; font: 650 20px/1.2 var(--display); }
.panel p { margin: 0; color: var(--dim); }
.list { display: grid; gap: 8px; }
.game { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.game .head { font-weight: 600; }
.game .head.won { color: var(--good); }
.game .head.lost { color: var(--p2); }
.game .meta { grid-column: 1; font: 500 12px/1.4 var(--mono); color: var(--dim); overflow-wrap: anywhere; }
.game button { grid-row: 1 / span 2; grid-column: 2; }
.wait { max-width: 560px; margin: 12vh auto 0; padding: 0 16px; display: grid; gap: 10px; }
.wait h1 { margin: 0; font: 650 26px/1.2 var(--display); }
.wait p { margin: 0; color: var(--dim); }

/* a phone: the bar keeps the brand, the status and Your games, so the versus screen's Play button stays in sight */
@media (max-width: 560px) {
  .bar { padding: 8px 12px; gap: 4px 10px; }
  .title, .who { display: none; }
  .bar .status { order: 5; flex-basis: 100%; }
}
@media (prefers-reduced-motion: reduce) {
  .status[data-tone="busy"] i { animation: none; }
}
</style>
</head>
<body>
<div class="bar">
  <a class="brand" href="/">SWU Arena</a>
  <span class="title">Play against a bot</span>
  <span data-feedback-slot=""></span>
  <span class="grow"></span>
  <span class="status" id="status" data-tone="busy" role="status" aria-live="polite"><i></i><span>Loading…</span></span>
  <button id="games-btn" type="button" hidden>Your games</button>
  <span class="who" id="who"></span>
</div>
<div id="wait" class="wait" hidden><h1>Getting the table ready</h1><p id="wait-text"></p></div>
<div id="table" hidden></div>
<div id="viewer-wrap" hidden>
  <div><button id="back" type="button">Back</button></div>
  <div id="viewer"></div>
</div>
<div id="games" class="panel" hidden>
  <div><button id="games-back" type="button">Back</button></div>
  <h2>Your games</h2>
  <p>Every game you finish here is saved to the arena. Games here are unrated.</p>
  <div class="list" id="mine"></div>
  <h2 id="all-h" hidden>Every game played here</h2>
  <div class="list" id="all" hidden></div>
</div>
<script src="/play/kit.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  // card art through the window (bot/arena/art.js): this page is isolated with require-corp, which blocks the CDN's images
  SWUViewer.setArtResolver?.((code, back) => {
    const m = /^([A-Z0-9]{2,6})_(\d{3})$/.exec(code);
    return m ? `/art/${m[1]}/${m[2]}${back ? '-b' : ''}.png` : null;
  });
  const size = (n) => (n == null ? '?' : n < 1048576 ? `${Math.max(1, Math.round(n / 1024))} KB` : `${(n / 1048576).toFixed(n < 104857600 ? 1 : 0)} MB`);
  const sleep = (ms, signal) => new Promise((ok, no) => {
    const t = setTimeout(ok, ms);
    signal?.addEventListener('abort', () => { clearTimeout(t); no(new DOMException('cancelled', 'AbortError')); }, { once: true });
  });
  let info = null; // /api/play/info
  let lineup = null; // /api/play/bots: the bots a person may pick
  let saving = 0; // replays being sent to the arena: leaving the page now would cancel the request
  let view = 'wait';
  const RANDOM = 'random'; // the bot's deck when the person picks none: one of the lists, by each game's seed

  function status(text, tone = 'idle') {
    $('status').dataset.tone = tone;
    $('status').lastElementChild.textContent = text;
  }

  // ---- what this tab has: the play worker (made once the engine is here), what it downloaded, what the worker has
  const tab = {
    worker: null,
    ready: null, // the worker's ready message
    up: false, // the worker said ready
    fetched: new Set(), // URLs downloaded in this tab
    bytes: new Map(), // URL -> bytes downloaded and not yet given to the worker
    sent: new Set() // what the worker has: 'jepa' (its models), a bundle's sha256, 'python'
  };
  let mounted = null; // Holotable's play screen
  let playing = false;

  // what shows under the bar
  function show(which) {
    view = which;
    for (const id of ['wait', 'table', 'games']) $(id).hidden = which !== id;
    $('viewer-wrap').hidden = which !== 'viewer';
    chrome();
    window.scrollTo(0, 0);
  }
  function chrome() {
    $('games-btn').hidden = !info || view === 'games';
  }
  const home = () => (mounted ? 'table' : 'wait');

  let viewer = null;
  let backTo = 'table';
  function watch(jsonl) {
    viewer?.destroy?.();
    show('viewer');
    // the replay is all this page shows now, so its keys (? lists them) work anywhere on the page
    viewer = SWUViewer.mount($('viewer'), { jsonl, follow: false, keyboard: 'window' });
  }
  $('back').onclick = () => {
    viewer?.destroy?.();
    viewer = null;
    show(backTo === 'games' ? 'games' : home());
  };
  $('games-back').onclick = () => show(home());
  $('games-btn').onclick = () => {
    renderGames();
    show('games');
  };

  // ---- the opponents
  // an interpreter an arena bot needs (null: none, or not known yet: bot.runtime is null until the window has its bundle)
  const runtimeOf = (bot) => (bot.kind === 'arena' && bot.runtime && bot.runtime !== 'wasi-p1' ? lineup?.runtimes?.[bot.runtime] ?? null : null);
  const titleOf = (bot) => bot.title || bot.name;
  const byName = (name) => lineup?.bots.find((b) => b.name === name) ?? null;

  /**
   * What a game against this bot needs that the worker does not have yet: [{group, url, bytes, wire, keep}], downloaded
   * in this tab or not. bytes: the file as the page reads it (unzipped); wire: about what it downloads (gzipped); keep:
   * the bytes go to the worker. The engine's files leave the list once the worker is made.
   */
  function filesOf(bot) {
    const out = [];
    const add = (group, f, keep) => {
      if (!out.some((x) => x.url === f.url)) out.push({ group, url: f.url, bytes: f.bytes ?? null, wire: f.wire ?? f.bytes ?? null, keep });
    };
    if (!tab.worker) {
      add('Rules engine', info.files.pack, true);
      add('Rules engine', info.files.worker, false);
    }
    if (bot.kind === 'jepa' && !tab.sent.has('jepa')) {
      for (const f of bot.files) add(`${titleOf(bot)}: its models`, f, true);
    }
    if (bot.kind === 'arena') {
      add('Bot runner', info.files.botWorker, false);
      if (!tab.sent.has(bot.bundle.hex)) add(titleOf(bot), bot.bundle, true);
      const rt = runtimeOf(bot);
      if (rt && !tab.sent.has('python')) {
        add('Python for bots', rt.lib, true);
        add('Python for bots', rt.wasm, true);
      }
    }
    return out;
  }
  // the files every game shares: they keep downloading whoever stops looking
  const shared = (url) => url === info.files.pack.url || url === info.files.worker.url || url === info.files.botWorker.url;
  // what a list of files downloads
  const sum = (items) => items.reduce((a, x) => a + (x.wire ?? x.bytes ?? 0), 0);

  function unavailable(bot) {
    if (bot.kind !== 'arena') return null;
    if (!window.crossOriginIsolated) return 'This browser cannot run arena bots on this page. Recent Chrome, Edge, Firefox and Safari can.';
    if (!bot.runtime) return 'This bot is still on its way from the arena to this site. Reload the page in a minute.';
    if (bot.runtime !== 'wasi-p1' && !runtimeOf(bot)) return `It needs the ${bot.runtime} runtime, which this arena does not have yet.`;
    return null;
  }

  // the line under a bot's name on the versus screen
  function noteOf(bot) {
    if (bot.kind === 'jepa') return bot.about || null;
    const parts = [lineup.round != null ? `round ${lineup.round}` : null, bot.runtime === 'wasi-p1' ? 'WebAssembly' : bot.runtime ? 'Python' : null, bot.capMs ? `${Math.round(bot.capMs / 1000)} s a game` : null];
    return parts.filter(Boolean).join(' · ') || null;
  }

  // ---- downloads: each file once, shared by every bot that needs it. A bot's own files stop when nobody wants them
  // (the person looked at another bot and has not pressed Play), so swiping through the bots does not fetch them all.
  const loads = new Map(); // url -> {it, got, raw, wire, waiting, error, ctl, want, promise}
  const watchers = new Set(); // functions that report progress (Table.prepare)
  let pinged = false;
  function ping() {
    if (pinged) return;
    pinged = true;
    setTimeout(() => {
      pinged = false;
      for (const w of watchers) w();
    }, 150);
  }
  /** Starts a file's download, or joins the one under way; {promise} settles when the tab has it. */
  function load(it) {
    if (tab.fetched.has(it.url)) return { promise: Promise.resolve() };
    const had = loads.get(it.url);
    if (had && !had.error) return had;
    const l = { it, got: 0, raw: it.bytes, wire: it.wire, waiting: false, error: null, ctl: new AbortController(), want: had?.want ?? 0, promise: null };
    loads.set(it.url, l);
    l.promise = download(l).then(() => {
      loads.delete(it.url);
      ping();
    }, (e) => {
      if (l.ctl.signal.aborted) {
        if (loads.get(it.url) === l) loads.delete(it.url);
      } else {
        l.error = String(e?.message || e);
        console.error('[play]', l.error);
      }
      ping();
      throw e;
    });
    l.promise.catch(() => undefined);
    return l;
  }
  /** Keeps a bot's own files downloading while someone wants them: the returned function lets go. */
  function want(bot) {
    const urls = filesOf(bot).filter((it) => !shared(it.url)).map((it) => it.url);
    for (const it of filesOf(bot)) {
      const l = load(it);
      if (!shared(it.url) && l.ctl) l.want++;
    }
    return () => {
      for (const u of urls) {
        const l = loads.get(u);
        if (l && --l.want <= 0 && !l.error) l.ctl.abort();
      }
    };
  }

  /** Downloads one file, counting its bytes as they come (unzipped: x-raw-length is the total). */
  async function download(l) {
    const it = l.it;
    const signal = l.ctl.signal;
    for (let tries = 0; ; tries++) {
      const r = await fetch(it.url, { signal });
      if (r.status === 503 && tries < 18) {
        // a bundle the window has not kept yet comes from the games machine, which may be asleep
        l.waiting = true;
        ping();
        await sleep(10000, signal);
        continue;
      }
      if (!r.ok) {
        const j = await r.json().catch(() => null);
        throw new Error(`${it.group}: ${j?.error?.message || `HTTP ${r.status}`}`);
      }
      l.waiting = false;
      // x-raw-length: the file unzipped, what the body gives; content-length: what comes down the line
      const raw = Number(r.headers.get('x-raw-length'));
      if (raw > 0) {
        l.raw = raw;
        l.wire = Number(r.headers.get('content-length')) || l.wire;
      }
      const chunks = [];
      let n = 0;
      if (r.body?.getReader) {
        const reader = r.body.getReader();
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          n += value.length;
          l.got = n;
          ping();
        }
      } else {
        const b = new Uint8Array(await r.arrayBuffer());
        chunks.push(b);
        n = b.length;
        l.got = n;
      }
      if (raw > 0 && n !== raw) throw new Error(`${it.group}: the download was cut off (${size(n)} of ${size(raw)})`);
      if (it.keep) {
        const out = new Uint8Array(n);
        let o = 0;
        for (const c of chunks) {
          out.set(c, o);
          o += c.length;
        }
        tab.bytes.set(it.url, out);
      }
      tab.fetched.add(it.url);
      return;
    }
  }

  /** Where a bot's files are, as Holotable's Prep: all here and the engine started, or what is left of the total. */
  function prepOf(bot) {
    let total = 0;
    let got = 0;
    let known = true;
    let waiting = false;
    let error = null;
    for (const it of filesOf(bot)) {
      const l = loads.get(it.url);
      const wire = l?.wire ?? it.wire;
      if (wire == null) {
        known = false;
        continue;
      }
      const raw = l?.raw ?? it.bytes;
      total += wire;
      got += tab.fetched.has(it.url) ? wire : l && raw ? wire * Math.min(1, l.got / raw) : 0;
      waiting = waiting || !!l?.waiting;
      error = error || l?.error || null;
    }
    const ready = tab.up && filesOf(bot).every((it) => tab.fetched.has(it.url));
    return { ready, left: known ? Math.max(0, Math.round(total - got)) : null, total: known ? Math.round(total) : null, waiting, error: error || engineError };
  }

  // the engine: fetched as soon as the page has its file list, since every bot needs it; then the worker starts
  let engine = null;
  let engineError = null;
  function loadEngine() {
    if (!engine) {
      engineError = null;
      engine = (async () => {
        if (!tab.worker) {
          await Promise.all([info.files.pack, info.files.worker].map((f) => load({ group: 'Rules engine', url: f.url, bytes: f.bytes ?? null, wire: f.wire ?? f.bytes ?? null, keep: f === info.files.pack }).promise));
          startWorker();
        }
        await tab.ready;
      })();
      engine.catch((e) => {
        engine = null;
        engineError = String(e?.message || e);
        ping();
      });
    }
    return engine;
  }

  // ---- the table: the play worker, as Holotable's play/client.ts Table
  let readyOk = null;
  let readyNo = null;
  let starting = null;
  const acts = [];
  const games = new Map(); // id -> {msgs, subs, url, replay}
  let current = null;
  let early = []; // a game's first messages (hello) come before the worker says it started

  function startWorker() {
    const pack = tab.bytes.get(info.files.pack.url);
    tab.bytes.delete(info.files.pack.url);
    const worker = new Worker(info.files.worker.url);
    tab.worker = worker;
    tab.ready = new Promise((ok, no) => {
      readyOk = ok;
      readyNo = no;
    });
    worker.onmessage = onWorker;
    worker.onerror = (e) => {
      readyNo(new Error(e.message || 'the game worker did not start'));
      status('The game could not start in this browser.', 'bad');
    };
    worker.postMessage({ t: 'init', packBytes: pack, botWorker: info.files.botWorker.url }, [pack.buffer]);
    return tab.ready;
  }

  const deliver = (g, m) => {
    g.msgs.push(m);
    for (const s of g.subs) s.onMsg(m);
  };
  function onWorker(e) {
    const m = e.data;
    if (m.t === 'ready') {
      if (m.cardText) SWUViewer.loadCardText(m.cardText);
      tab.up = true;
      ping();
      readyOk(m);
    } else if (m.t === 'started') {
      current = m.id;
      games.set(m.id, { msgs: early, subs: new Set(), url: null });
      early = [];
      playing = true;
      starting?.ok({ id: m.id, seat: m.seat });
      starting = null;
      chrome();
      status('Playing. The game runs in this tab.', 'good');
    } else if (m.t === 'refused') {
      starting?.no(new Error(m.error));
      starting = null;
      early = [];
      chrome();
    } else if (m.t === 'acted') {
      const a = acts.shift();
      if (a) m.error ? a.no(new Error(m.error)) : a.ok({ ok: true });
    } else if (m.t === 'msg') {
      const g = current && games.get(current);
      if (!g) {
        early.push(m.msg);
        return;
      }
      if (m.msg.t === 'end') {
        playing = false;
        chrome();
        if (m.msg.replay) {
          g.url = URL.createObjectURL(new Blob([m.msg.replay], { type: 'application/x-ndjson' }));
          g.replay = m.msg.replay;
          save(m.msg.replay);
        } else {
          status('The game stopped before it could be saved.', 'bad');
        }
      }
      deliver(g, m.msg);
    } else if (m.t === 'error') {
      console.error('[play]', m.message);
      readyNo?.(new Error(String(m.message).split('\n')[0]));
      if (playing) {
        playing = false;
        chrome();
        status('The game stopped on an error. Reload the page to play again.', 'bad');
        const g = current && games.get(current);
        if (g) for (const s of g.subs) s.onError(true);
      }
    }
  }
  window.addEventListener('beforeunload', (e) => {
    if (playing || saving) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  /** What the worker needs with a game against this bot that it has not been given yet (play-worker.js start). */
  function extrasFor(bot) {
    const msg = {};
    const given = [];
    const take = (url) => tab.bytes.get(url);
    if (bot.kind === 'jepa' && !tab.sent.has('jepa')) {
      msg.files = bot.files.map((f) => [f.path, take(f.url)]);
      given.push(['jepa', bot.files.map((f) => f.url)]);
    }
    if (bot.kind === 'arena') {
      if (!tab.sent.has(bot.bundle.hex)) {
        msg.bundle = { name: bot.name, hex: bot.bundle.hex, tar: take(bot.bundle.url), capMs: bot.capMs };
        given.push([bot.bundle.hex, [bot.bundle.url]]);
      }
      const rt = runtimeOf(bot);
      if (rt && !tab.sent.has('python')) {
        msg.python = { lib: take(rt.lib.url), wasm: take(rt.wasm.url) };
        given.push(['python', [rt.lib.url, rt.wasm.url]]);
      }
    }
    return {
      msg,
      // once a game has started with them, the worker keeps them: this tab lets go of its copy
      given: () => {
        for (const [k, urls] of given) {
          tab.sent.add(k);
          for (const u of urls) tab.bytes.delete(u);
        }
      }
    };
  }

  // the table Holotable's play screen talks to (play/client.ts Table): every bot of the lineup, any deck list
  const table = {
    options: async () => {
      // the lists come with the page's info; a window that does not send them yet leaves the engine to name them
      const decks = info.decks?.length ? info.decks : (await loadEngine().then(() => tab.ready)).options.decks;
      const want = new URLSearchParams(location.search).get('bot');
      return {
        bots: lineup.bots.map((b) => b.name),
        botInfo: Object.fromEntries(lineup.bots.map((b) => [b.name, {
          title: titleOf(b), elo: b.elo, note: noteOf(b), bytes: sum(filesOf(b).filter((x) => !shared(x.url))) || null, unavailable: unavailable(b), featured: b.kind === 'jepa'
        }])),
        decks,
        botDeck: RANDOM,
        // /play?bot=<name> opens on that opponent
        bot: want && byName(want) ? want : null,
        notice: lineup.bots.some((b) => b.kind === 'arena') ? null : 'The arena\'s own bots show up here once a round has played.'
      };
    },
    prepare(name, onPrep) {
      const bot = byName(name);
      if (!bot || unavailable(bot)) {
        onPrep({ ready: false, left: null, total: null });
        return () => undefined;
      }
      loadEngine().catch(() => undefined);
      const release = want(bot);
      const tell = () => onPrep(prepOf(bot));
      watchers.add(tell);
      tell();
      return () => {
        watchers.delete(tell);
        release();
      };
    },
    start: async (name, deck, botDeck) => {
      const bot = byName(name);
      const why = bot ? unavailable(bot) : `no bot named ${name}`;
      if (why) throw new Error(why);
      if (starting) throw new Error('a game is starting');
      // its files keep coming while it starts, whatever the screen stops looking at
      const release = want(bot);
      try {
        status(`Getting ${titleOf(bot)} ready…`, 'busy');
        await loadEngine();
        await Promise.all(filesOf(bot).map((it) => load(it).promise));
        return await new Promise((ok, no) => {
          if (starting) return no(new Error('a game is starting'));
          const extra = extrasFor(bot);
          starting = { ok: (g) => { extra.given(); ok(g); }, no };
          current = null;
          early = [];
          chrome();
          tab.worker.postMessage({ t: 'start', bot: bot.name, deck, botDeck, ...extra.msg });
        });
      } catch (e) {
        status(`${titleOf(bot)} did not start: ${String(e?.message || e)}`, 'bad');
        throw e;
      } finally {
        release();
      }
    },
    act: (id, act) => new Promise((ok, no) => {
      acts.push({ ok, no });
      tab.worker.postMessage({ t: 'act', act });
    }),
    concede: () => {
      tab.worker.postMessage({ t: 'concede' });
      return Promise.resolve({ ok: true });
    },
    follow(id, onMsg, onError) {
      const g = games.get(id);
      if (!g) {
        onError(true);
        return () => undefined;
      }
      const sub = { onMsg, onError };
      for (const m of g.msgs) onMsg(m);
      g.subs.add(sub);
      return () => g.subs.delete(sub);
    },
    replayUrl: (id) => games.get(id)?.url ?? null,
    watch: (id) => (games.get(id)?.replay ? () => { backTo = 'table'; watch(games.get(id).replay); } : null),
    resumable: false,
    note: 'You sit at seat 1 with the real rules engine, which runs in this browser tab and downloads while you choose. The bot sees only what its seat sees: your hand and both decks stay hidden from it. Finished games are saved to the arena, unrated.',
    missing: 'Reload the page to try again.'
  };

  // ---- the person's games
  const when = (iso) => {
    const d = new Date(iso);
    return Number.isNaN(d.getTime()) ? '' : d.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
  };
  function gameRow(g, withPerson) {
    const row = document.createElement('div');
    row.className = 'game';
    const head = document.createElement('div');
    const bot = g.bot || 'the bot';
    const won = g.winner === 'you';
    const who = withPerson ? (g.person || 'someone') : 'You';
    head.className = `head ${won ? 'won' : g.winner === bot ? 'lost' : ''}`;
    head.textContent = g.conceded ? `${who} conceded to ${bot}` : won ? `${who} beat ${bot}` : g.winner === bot ? `${bot} won` : g.outcome === 'draw' ? `A draw with ${bot}` : `No result against ${bot}`;
    const meta = document.createElement('div');
    meta.className = 'meta';
    meta.textContent = `${when(g.playedAt)} · ${g.decks?.p1 ?? '?'} against ${g.decks?.p2 ?? '?'} · round ${g.rounds ?? '?'}, ${g.steps ?? '?'} moves`;
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = 'Watch';
    b.onclick = async () => {
      b.disabled = true;
      try {
        const r = await fetch(`/api/play/games/${encodeURIComponent(g.id)}.jsonl`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        backTo = 'games';
        watch(await r.text());
      } catch (e) {
        status(`Could not load that game: ${e.message}`, 'bad');
      } finally {
        b.disabled = false;
      }
    };
    row.append(head, b, meta);
    return row;
  }
  function renderGames() {
    const mine = $('mine');
    mine.replaceChildren(...(info?.games ?? []).map((g) => gameRow(g, false)));
    if (!mine.children.length) {
      const p = document.createElement('p');
      p.textContent = 'No games yet.';
      mine.append(p);
    }
    const all = info?.admin ? info.all ?? [] : null;
    $('all-h').hidden = $('all').hidden = !all;
    if (all) {
      $('all-h').textContent = `Every game played here (${info.played ?? all.length})`;
      $('all').replaceChildren(...all.map((g) => gameRow(g, true)));
    }
  }

  async function save(replay) {
    saving++;
    try {
      await send(replay);
    } finally {
      saving--;
    }
  }
  async function send(replay) {
    status('Saving the game to the arena…', 'busy');
    for (let i = 0; i < 5; i++) {
      try {
        const r = await fetch('/api/play/games', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ replay }) });
        const j = await r.json().catch(() => ({}));
        if (r.ok) {
          status('Saved to the arena.', 'good');
          getInfo().then((x) => { info = x; renderGames(); }, () => undefined);
          return;
        }
        if (r.status < 500) {
          status(`Not saved: ${j.error?.message || `HTTP ${r.status}`}. Download the replay to keep it.`, 'bad');
          return;
        }
      } catch {
        // the arena did not answer: try again
      }
      await sleep(2000 * 2 ** i);
    }
    status('Not saved: the arena did not answer. Download the replay to keep it.', 'bad');
  }

  async function api(path) {
    const r = await fetch(path, { headers: { accept: 'application/json' } });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error?.message || `HTTP ${r.status}`);
    return j.result;
  }
  const getInfo = () => api('/api/play/info');

  async function main() {
    if (!window.SWUViewer?.mountPlay) {
      status('The page did not load completely. Reload it.', 'bad');
      return;
    }
    for (let tries = 0; ; tries++) {
      try {
        info = await getInfo();
      } catch (e) {
        status(`The arena did not answer: ${e.message}`, 'bad');
        return;
      }
      $('who').textContent = `@${info.login}`;
      if (info.ready) break;
      show('wait');
      $('wait-text').textContent = info.why || 'The game files are not here yet.';
      status('Waiting for the game files…', 'busy');
      if (tries >= 30) {
        status('The game files did not come. Try again later.', 'bad');
        return;
      }
      await sleep(10000);
    }
    try {
      lineup = await api('/api/play/bots');
    } catch (e) {
      status(`The arena did not list its bots: ${e.message}`, 'bad');
      return;
    }
    show('table');
    mounted = SWUViewer.mountPlay($('table'), { table });
    chrome();
    status('Pick your opponent and your deck.', 'idle');
    // every bot needs the engine: it downloads while the person chooses
    loadEngine().then(() => {
      if (!playing && !starting) status('Pick your opponent and your deck. The rules engine is loaded.', 'good');
    }, (e) => status(`The rules engine did not load: ${String(e?.message || e)}`, 'bad'));
  }
  main();
})();
</script>
</body>
</html>
