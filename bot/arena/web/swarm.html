<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SWU Arena Swarm</title>
<style>
/* Layout: a header over a starfield, the join control, then one card per slot with its two games, then the seeds this
   tab finished. Same-origin only: the page is cross-origin isolated (its bots block on SharedArrayBuffer pipes). */
:root {
  --bg: #090c16; --panel: #11172a; --line: #212a45; --ink: #e3e7f3; --muted: #8b94ad; --faint: #4a5371;
  --p1: #6fc3ff; --p2: #ff8ac9; --gold: #ffd166; --good: #4fd08f; --warn: #f0b552; --bad: #ff7b72; --accent: #8fa8ff;
  --mono: ui-monospace, "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
  --sans: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
header { position: relative; overflow: hidden; border-bottom: 1px solid var(--line); }
#stars { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.top { position: relative; max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 22px 18px; display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; justify-content: space-between; }
.brand { font: 700 13px/1 var(--mono); letter-spacing: .22em; text-transform: uppercase; color: var(--muted); }
h1 { margin: 6px 0 0; font: 650 28px/1.1 var(--sans); letter-spacing: .01em; text-wrap: balance; }
h1 span { background: linear-gradient(90deg, var(--p1), var(--accent), var(--p2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.pill { display: inline-flex; gap: 8px; align-items: center; font: 600 12px/1 var(--mono); letter-spacing: .08em; text-transform: uppercase; padding: 8px 12px; border-radius: 999px; border: 1px solid var(--line); background: rgba(17, 23, 42, .8); }
.pill i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
.pill[data-phase="playing"] i, .pill[data-phase="connected"] i { background: var(--good); box-shadow: 0 0 10px var(--good); }
.pill[data-phase="connecting"] i, .pill[data-phase="loading"] i { background: var(--accent); }
.pill[data-phase="nomachine"] i, .pill[data-phase="stale"] i { background: var(--warn); }
.pill[data-phase="stopped"] i, .pill[data-phase="error"] i { background: var(--bad); }
main { max-width: 1100px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 22px; }
.control { display: flex; flex-wrap: wrap; gap: 16px 28px; align-items: center; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; }
button { font: 650 15px/1 var(--sans); border-radius: 10px; border: 1px solid transparent; cursor: pointer; padding: 12px 18px; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#join { background: linear-gradient(90deg, #3f6bff, #8a5cff); color: white; min-width: 170px; }
#join[data-on="1"] { background: transparent; color: var(--ink); border-color: var(--line); }
#join:disabled { opacity: .45; cursor: not-allowed; }
.stepper { display: inline-flex; align-items: center; gap: 10px; font: 600 14px var(--mono); }
.stepper button { padding: 8px 12px; background: #1a2240; color: var(--ink); border-color: var(--line); }
.stepper button:disabled { opacity: .35; cursor: default; }
.stepper output { min-width: 2ch; text-align: center; font-size: 18px; }
.cpu { display: grid; gap: 6px; min-width: 220px; flex: 1; }
.cpu .bar { height: 8px; border-radius: 5px; background: #1a2240; position: relative; overflow: hidden; }
.cpu .bar b { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, var(--p1), var(--accent)); border-radius: 5px; transition: width .4s; }
.label { font: 600 11px/1.2 var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.note { color: var(--muted); font-size: 13px; }
.stats { display: flex; flex-wrap: wrap; gap: 10px 26px; font: 500 14px var(--mono); color: var(--muted); }
.stats b { color: var(--ink); font-size: 20px; margin-right: 6px; font-variant-numeric: tabular-nums; }
.slots { display: grid; grid-template-columns: repeat(auto-fit, minmax(330px, 1fr)); gap: 14px; }
.slot { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; display: grid; gap: 12px; min-width: 0; }
.slot header { border: 0; overflow: visible; display: flex; justify-content: space-between; align-items: baseline; font: 600 12px var(--mono); color: var(--muted); letter-spacing: .06em; }
.slot header b { color: var(--accent); font-size: 13px; }
.game { display: grid; gap: 6px; padding: 10px 12px; border-radius: 10px; background: #0d1222; min-width: 0; }
.game .meta { display: flex; justify-content: space-between; font: 500 12px var(--mono); color: var(--muted); }
.side { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; font: 600 13px var(--mono); }
.side .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.side.p1 .name { color: var(--p1); } .side.p2 .name { color: var(--p2); }
.side .hp { font-variant-numeric: tabular-nums; color: var(--ink); }
.side .bar { grid-column: 1 / -1; height: 7px; border-radius: 4px; background: #1a2240; overflow: hidden; }
.side .bar b { display: block; height: 100%; border-radius: 4px; transition: width .5s ease, background-color .3s; }
.side .bar b.hit { animation: hit .45s ease-out; }
@keyframes hit { 0% { filter: brightness(1.9); } 100% { filter: none; } }
.side .units { grid-column: 1 / -1; font: 500 11px var(--mono); color: var(--muted); min-height: 1.4em; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.win { font: 700 14px var(--mono); color: var(--gold); text-shadow: 0 0 12px rgba(255, 209, 102, .45); }
.idle { color: var(--faint); font: 500 13px var(--mono); padding: 18px 0; text-align: center; }
.done { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font: 500 13px var(--mono); font-variant-numeric: tabular-nums; }
td, th { padding: 9px 14px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
th { font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
td .w { color: var(--gold); font-weight: 700; }
td .f { color: var(--warn); }
td.f { color: var(--bad); white-space: normal; }
.empty { color: var(--faint); }
@media (prefers-reduced-motion: reduce) { .side .bar b { transition: none; } .side .bar b.hit { animation: none; } }
</style>
</head>
<body>
<header>
  <canvas id="stars" aria-hidden="true"></canvas>
  <div class="top">
    <div>
      <div class="brand">SWU Arena</div>
      <h1>The <span>swarm</span>: your browser plays arena games</h1>
    </div>
    <div class="pill" id="pill" data-phase="loading"><i></i><span id="phase">Loading</span></div>
  </div>
</header>
<main>
  <section class="control" aria-label="Join the swarm">
    <button id="join" type="button" disabled>Join the swarm</button>
    <div class="stepper" role="group" aria-label="Seeds at once">
      <span class="label">Seeds at once</span>
      <button id="minus" type="button" aria-label="Fewer">−</button>
      <output id="slots">1</output>
      <button id="plus" type="button" aria-label="More">+</button>
    </div>
    <div class="cpu">
      <div class="label" id="cpuLabel">About 2 games at once</div>
      <div class="bar"><b id="cpuBar" style="width:0%"></b></div>
      <div class="note" id="note">Checking the games machine…</div>
    </div>
  </section>
  <section class="stats" aria-label="This tab">
    <span><b id="sGames">0</b>games played</span>
    <span><b id="sSeeds">0</b>seeds</span>
    <span><b id="sRate">0</b>games per hour</span>
    <span><b id="sFailed">0</b>handed back</span>
  </section>
  <section class="slots" id="live" aria-label="Seeds in play"></section>
  <section class="done" aria-label="Finished seeds">
    <table>
      <thead><tr><th>Time</th><th>Seed</th><th>Result, both seats</th><th>Took</th></tr></thead>
      <tbody id="done"><tr><td class="empty" colspan="4">No seed finished in this tab yet.</td></tr></tbody>
    </table>
  </section>
</main>
<script>
'use strict';
const $ = (id) => document.getElementById(id);
const cores = navigator.hardwareConcurrency || 4;
const store = { get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch { return d; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch { /* private window */ } } };
let slots = Math.max(1, Math.min(8, Number(store.get('swarm.slots', Math.max(1, Math.floor(cores / 6)))) || 1));
let info = null, worker = null, joined = false;
const started = Date.now();
const S = { games: 0, seeds: 0, failed: 0 };
const leases = new Map(); // lease -> {slot, seed, games: Map(id -> {bots, last, result}), el}
const PHASES = { loading: 'Loading', ready: 'Ready', waiting: 'Joined, waiting for a round', connecting: 'Connecting', connected: 'Waiting for a seed', playing: 'Playing', nomachine: 'Machine asleep', stale: 'Reloading', stopped: 'Not playing', error: 'Error' };
// what a round needs: the games machine wakes for one when a bot is submitted, changed or withdrawn, or a day after the last
const ASLEEP = 'No round is playing, so the games machine is asleep. A round starts when a bot is submitted, changed or withdrawn, or a day after the last one.';

function setPhase(phase, note) {
  $('pill').dataset.phase = phase;
  $('phase').textContent = PHASES[phase] ?? phase;
  if (note !== undefined) $('note').textContent = note;
}
function showSlots() {
  $('slots').textContent = slots;
  $('cpuLabel').textContent = `${slots * 2} games at once, about ${Math.round(Math.min(100, (slots * 1.6 / cores) * 100))}% of this computer's ${cores} cores`;
  $('cpuBar').style.width = `${Math.min(100, (slots * 1.6 / cores) * 100)}%`;
}
$('minus').onclick = () => { if (!joined && slots > 1) { slots--; store.set('swarm.slots', slots); showSlots(); } };
$('plus').onclick = () => { if (!joined && slots < 8) { slots++; store.set('swarm.slots', slots); showSlots(); } };
showSlots();

// --- what a replay step says about each side
function side(p) {
  if (!p) return null;
  const units = [...(p.ground ?? []).map((u) => `▪${u.p ?? 0}`), ...(p.space ?? []).map((u) => `▴${u.p ?? 0}`)];
  return { hp: Number(p.base?.hp) || 0, d: Number(p.base?.d) || 0, leader: String(p.leader?.n ?? ''), hand: p.handCount ?? 0, ready: p.res?.ready ?? 0, total: p.res?.total ?? 0, units };
}
const hpColor = (f) => (f > 0.6 ? 'var(--good)' : f > 0.3 ? 'var(--warn)' : 'var(--bad)');
const esc = (s) => String(s ?? '').replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);

// Each seed is an element made once and then updated, so bars ease from one hp to the next.
function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text !== undefined) e.textContent = text;
  return e;
}
function sideEl(k) {
  const root = el('div', `side ${k}`);
  const name = el('span', 'name'), hp = el('span', 'hp'), bar = el('div', 'bar'), fill = el('b'), units = el('div', 'units');
  bar.append(fill);
  root.append(name, hp, bar, units);
  return { root, name, hp, fill, units };
}
function gameEl(g) {
  const root = el('div', 'game');
  const meta = el('div', 'meta'), left = el('span'), right = el('span');
  meta.append(left, right);
  const p1 = sideEl('p1'), p2 = sideEl('p2'), win = el('div', 'win');
  root.append(meta, p1.root, p2.root, win);
  g.dom = { root, left, right, p1, p2, win };
  return root;
}
function updateGame(g) {
  const d = g.dom;
  if (g.result) {
    const w = g.result.winner;
    d.left.textContent = `${g.bots[0]} vs ${g.bots[1]}`;
    d.right.textContent = `R${g.result.round} · ${g.result.steps} steps`;
    d.p1.root.hidden = d.p2.root.hidden = true;
    d.win.hidden = false;
    d.win.textContent = w && w !== 'draw' ? `★ ${w} wins` : g.result.outcome;
    return;
  }
  d.win.hidden = true;
  if (!g.last) {
    d.left.textContent = `${g.bots[0]} vs ${g.bots[1]}`;
    d.right.textContent = 'loading the bots…';
    d.p1.root.hidden = d.p2.root.hidden = true;
    return;
  }
  const s = g.last;
  d.left.textContent = `Round ${s.round}`;
  d.right.textContent = `step ${s.n}`;
  for (const [k, i] of [['p1', 0], ['p2', 1]]) {
    const v = d[k], p = s[k];
    v.root.hidden = false;
    v.name.textContent = `${s.actor === k ? '◆ ' : ''}${g.bots[i]}`;
    const f = p && p.hp ? Math.max(0, p.hp - p.d) / p.hp : 1;
    v.hp.textContent = p ? Math.max(0, p.hp - p.d) : '?';
    v.fill.style.width = `${(f * 100).toFixed(1)}%`;
    v.fill.style.backgroundColor = hpColor(f);
    if (g.hit?.[k] && g.hit[k] !== v.seenHit) {
      v.seenHit = g.hit[k];
      v.fill.classList.remove('hit');
      void v.fill.offsetWidth;
      v.fill.classList.add('hit');
    }
    v.units.textContent = p ? `${p.leader} · ${p.hand} in hand · ${p.ready}/${p.total} ready · ${p.units.join(' ') || 'no units'}` : '';
  }
}
function renderLive() {
  const live = $('live');
  if (!leases.size) {
    live.replaceChildren(Object.assign(el('div', 'slot'), {}));
    live.firstChild.append(el('div', 'idle', joined ? 'Waiting for the games machine to hand out a seed…' : 'Join to play seeds of the next round in this tab.'));
    return;
  }
  if (live.querySelector('.idle')) live.replaceChildren();
  for (const [id, l] of leases) {
    if (!l.dom) {
      const root = el('article', 'slot');
      const head = el('header'), title = el('b', null, `Seed ${l.seed}`), age = el('span');
      head.append(title, age);
      root.append(head);
      for (const g of l.games.values()) root.append(gameEl(g));
      l.dom = { root, age };
      live.append(root);
    }
    l.dom.age.textContent = `${Math.round((Date.now() - l.at) / 1000)} s`;
    for (const g of l.games.values()) updateGame(g);
  }
  for (const child of [...live.children]) {
    if (![...leases.values()].some((l) => l.dom?.root === child)) child.remove();
  }
}
let dirty = true;
setInterval(() => { if (dirty) { dirty = false; renderLive(); } }, 200);
setInterval(() => { dirty = true; const h = Math.max(1 / 60, (Date.now() - started) / 3600000); $('sRate').textContent = Math.round(S.games / h); }, 1000);

function addDone(row) {
  const tb = $('done');
  if (tb.querySelector('.empty')) tb.innerHTML = '';
  const tr = document.createElement('tr');
  tr.innerHTML = row;
  tb.prepend(tr);
  while (tb.children.length > 40) tb.lastChild.remove();
}

function onMessage(m) {
  if (m.t === 'state') {
    if (m.phase === 'nomachine' && joined) {
      // the round ended and the machine went to sleep: the tab keeps trying, and plays when the next round starts
      setPhase('waiting', `${ASLEEP} This tab plays again when the next round starts; keep it open.`);
      return;
    }
    setPhase(m.phase === 'connected' && leases.size ? 'playing' : m.phase, m.note ?? '');
    if (m.phase === 'stale') {
      // a new build of the games machine: reload for its files and join again
      store.set('swarm.rejoin', '1');
      setTimeout(() => location.reload(), 3000);
    }
  } else if (m.t === 'hello') {
    setPhase('connected', `Connected as ${info.login}. Keep this tab open while it plays.`);
  } else if (m.t === 'lease') {
    leases.set(m.lease, { seed: m.seed, at: Date.now(), games: new Map(m.games.map((g) => [g.id, { bots: [g.p1, g.p2], last: null }])) });
    setPhase('playing');
    dirty = true;
  } else if (m.t === 'step') {
    const g = leases.get(m.lease)?.games.get(m.game);
    if (g && m.step?.state) {
      const st = m.step.state;
      const next = { n: m.step.n, actor: m.step.pid, round: st.round, p1: side(st.players?.p1), p2: side(st.players?.p2) };
      g.hit = g.hit ?? {};
      for (const k of ['p1', 'p2']) if (g.last?.[k] && next[k] && next[k].d > g.last[k].d) g.hit[k] = Date.now();
      g.last = next;
      dirty = true;
    }
  } else if (m.t === 'game') {
    const g = leases.get(m.lease)?.games.get(m.game);
    if (g) { g.result = m.result; dirty = true; }
  } else if (m.t === 'done' || m.t === 'failed') {
    const l = leases.get(m.lease);
    leases.delete(m.lease);
    const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    if (m.t === 'done') {
      S.seeds++; S.games += m.results.length;
      // both seats as one score: the first game's p1 against its p2
      const [a, b] = l ? [...l.games.values()][0].bots : ['?', '?'];
      const wa = m.results.filter((r) => r.winner === a).length, wb = m.results.filter((r) => r.winner === b).length;
      const odd = m.results.filter((r) => r.outcome !== 'won').map((r) => esc(r.outcome)).join(', ');
      addDone(`<td>${time}</td><td>${esc(l?.seed ?? '')}</td><td><span class="${wa > wb ? 'w' : ''}">${esc(a)}</span> ${wa} – ${wb} <span class="${wb > wa ? 'w' : ''}">${esc(b)}</span>${odd ? ` <span class="f">${odd}</span>` : ''}</td><td>${m.secs} s</td>`);
    } else {
      S.failed++;
      addDone(`<td>${time}</td><td>${esc(l?.seed ?? '')}</td><td class="f">Handed back: ${esc(m.why)}</td><td></td>`);
    }
    $('sGames').textContent = S.games; $('sSeeds').textContent = S.seeds; $('sFailed').textContent = S.failed;
    if (!leases.size && joined) setPhase('connected');
    dirty = true;
  } else if (m.t === 'log' && m.level === 'error') {
    console.warn('[swarm]', m.text);
  }
}

async function join() {
  if (joined) {
    worker?.postMessage({ t: 'stop' });
    const w = worker;
    setTimeout(() => w?.terminate(), 4000);
    worker = null; joined = false; leases.clear();
    $('minus').disabled = $('plus').disabled = false;
    $('join').textContent = 'Join the swarm'; $('join').dataset.on = '0';
    setPhase('stopped', 'Not playing. Seeds this tab held go back to the games machine.');
    dirty = true;
    return;
  }
  if (!self.crossOriginIsolated) { setPhase('error', 'This browser did not isolate the page, which the bots need (SharedArrayBuffer).'); return; }
  joined = true;
  $('minus').disabled = $('plus').disabled = true;
  $('join').textContent = 'Leave the swarm'; $('join').dataset.on = '1';
  dirty = true;
  start();
}

// Joined: the tab starts playing as soon as the games machine is awake, and checks every 30 s until it is.
async function start() {
  if (!joined || worker) return;
  if (!info?.ready) {
    setPhase('waiting', `${ASLEEP} This tab joins by itself when the next round starts; keep it open.`);
    setTimeout(async () => { await refresh(); start(); }, 30000);
    return;
  }
  worker = new Worker(info.files.executor);
  worker.onmessage = (e) => onMessage(e.data);
  worker.onerror = (e) => setPhase('error', `The swarm stopped: ${e.message}`);
  worker.postMessage({ t: 'start', api: '/api/swarm', files: info.files, build: info.build, cards: info.cards, slots });
  setPhase('connecting', 'Loading the engine and saying hello to the games machine…');
}
$('join').onclick = join;

/** /api/swarm/info: whether the games machine is awake, and the build (and its files) a tab must load. */
async function refresh() {
  try {
    const r = await fetch('/api/swarm/info', { credentials: 'same-origin' });
    const body = await r.json();
    if (!r.ok) { setPhase('error', body?.error?.message ?? `The swarm is not available (${r.status}).`); return false; }
    info = body;
    return true;
  } catch (e) {
    setPhase('error', `Could not reach the window (${e.message}).`);
    return false;
  }
}
async function load() {
  if (!(await refresh())) return;
  $('join').disabled = false;
  if (store.get('swarm.rejoin', '') === '1') {
    // the page reloaded itself for a new build while it was joined
    store.set('swarm.rejoin', '');
    join();
    return;
  }
  setPhase(info.ready ? 'ready' : 'nomachine', info.ready
    ? `Signed in as ${info.login}. A round is playing: join to take seeds. Bots run in sandboxed workers with no network; closing the tab hands its seeds back.`
    : `Signed in as ${info.login}. ${ASLEEP} You can join now and this tab starts with the next round.`);
}
load();

// --- the starfield: stars fly faster while this tab plays
(() => {
  const c = $('stars');
  const g = c.getContext('2d');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let stars = [];
  const size = () => {
    c.width = c.offsetWidth * devicePixelRatio; c.height = c.offsetHeight * devicePixelRatio;
    stars = Array.from({ length: Math.round(c.width / 9) }, () => ({ x: Math.random() * c.width, y: Math.random() * c.height, z: 0.2 + Math.random() * 0.8 }));
  };
  size(); addEventListener('resize', size);
  const frame = () => {
    const speed = still ? 0 : (leases.size ? 6 : joined ? 1.2 : 0.35) * devicePixelRatio;
    g.clearRect(0, 0, c.width, c.height);
    for (const s of stars) {
      s.x -= s.z * speed;
      if (s.x < 0) { s.x += c.width; s.y = Math.random() * c.height; }
      const len = Math.max(1, s.z * speed * 4);
      g.fillStyle = `rgba(${s.z > 0.7 ? '220,230,255' : '140,160,220'},${0.25 + s.z * 0.6})`;
      g.fillRect(s.x, s.y, len, s.z > 0.7 ? 2 : 1);
    }
    requestAnimationFrame(frame);
  };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
