<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SWU Arena Play</title>
<style>
/* The open tables (bot/arena/tables.js): a bar over Holotable's play screen (SWUViewer.mountPlay). Every game runs in
   a player's tab (tables-worker.js): a bot game here, a people game in the host's tab, with the guest's tab linked to
   it directly (WebRTC) or through the window's lobby. Finished games go back to the window. Dark like Holotable. */
:root {
  --bg: #060a13; --panel: #0f1829; --line: #1d2a44; --ink: #e6ecf8; --dim: #8494b8;
  --p1: #56c8ff; --p2: #ff5f6d; --gold: #f6c454; --good: #4fe0a8; --bad: #ff7b72;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --display: "Oxanium", "Eurostile", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
.bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: color-mix(in oklab, var(--panel) 88%, transparent); backdrop-filter: blur(8px); }
.brand { font: 600 12px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--dim); text-decoration: none; }
.title { font: 650 17px/1.2 var(--display); }
.grow { flex: 1; }
.status { display: inline-flex; align-items: center; gap: 8px; font: 500 13px/1.3 var(--mono); color: var(--dim); min-width: 0; }
.status i { width: 8px; height: 8px; border-radius: 50%; background: var(--dim); flex: none; }
.status[data-tone="good"] i { background: var(--good); box-shadow: 0 0 8px var(--good); }
.status[data-tone="busy"] i { background: var(--p1); animation: pulse 1s ease-in-out infinite alternate; }
.status[data-tone="bad"] i { background: var(--bad); }
.status[data-tone="bad"] { color: var(--ink); }
.progress { width: 120px; height: 6px; border-radius: 3px; background: var(--line); overflow: hidden; flex: none; }
.progress b { display: block; height: 100%; width: 0; background: linear-gradient(90deg, var(--p1), var(--gold)); transition: width .2s; }
@keyframes pulse { from { opacity: .35; } to { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .status[data-tone="busy"] i { animation: none; } .progress b { transition: none; } }
button, a.btn { font: 600 14px/1 var(--sans); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; cursor: pointer; text-decoration: none; }
button:hover, a.btn:hover { border-color: color-mix(in oklab, var(--p1) 50%, var(--line)); }
button:focus-visible, a.btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
.who { font: 500 13px/1 var(--mono); color: var(--dim); }
#table { min-height: calc(100dvh - 58px); }
#viewer-wrap { padding: 12px 16px 24px; display: grid; gap: 12px; }
#viewer { min-height: calc(100dvh - 140px); }
.panel { max-width: 860px; margin: 0 auto; padding: 20px 16px 48px; display: grid; gap: 18px; }
.panel h2 { margin: 0; font: 650 20px/1.2 var(--display); }
.panel p { margin: 0; color: var(--dim); }
.list { display: grid; gap: 8px; }
.game { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 12px; align-items: center; padding: 12px 14px; border: 1px solid var(--line); border-radius: 10px; background: var(--panel); }
.game .head { font-weight: 600; }
.game .head.won { color: var(--good); }
.game .head.lost { color: var(--p2); }
.game .meta { grid-column: 1; font: 500 12px/1.4 var(--mono); color: var(--dim); overflow-wrap: anywhere; }
.game button { grid-row: 1 / span 2; grid-column: 2; }
</style>
</head>
<body>
<div class="bar">
  <a class="brand" href="/">SWU Arena</a>
  <span class="title">Play</span>
  <span data-feedback-slot=""></span>
  <span class="grow"></span>
  <span class="status" id="status" data-tone="busy" role="status" aria-live="polite"><i></i><span>Loading…</span></span>
  <span class="progress" id="progress" hidden aria-hidden="true"><b></b></span>
  <button id="games-btn" type="button" hidden>Your games</button>
  <a class="btn" href="/tables/logs">Logs</a>
  <span class="who" id="who"></span>
</div>
<div id="table"></div>
<div id="viewer-wrap" hidden>
  <div><button id="back" type="button">Back to the table</button></div>
  <div id="viewer"></div>
</div>
<div id="games" class="panel" hidden>
  <div><button id="games-back" type="button">Back to the table</button></div>
  <h2>Your games</h2>
  <p>Every game you finish here is kept for training, unrated, under your player id. <a href="/tables/logs">Anyone signed in with GitHub can read the logs.</a></p>
  <div class="list" id="mine"></div>
  <h2 id="all-h" hidden>Every game played here</h2>
  <div class="list" id="all" hidden></div>
</div>
<script src="/tables/kit.js"></script>
<script>
(() => {
  'use strict';
  const $ = (id) => document.getElementById(id);
  // card art through the window (bot/arena/art.js): this page is isolated with require-corp, which blocks the CDN's images
  SWUViewer.setArtResolver?.((code, back) => {
    const m = /^([A-Z0-9]{2,6})_(\d{3})$/.exec(code);
    return m ? `/art/${m[1]}/${m[2]}${back ? '-b' : ''}.png` : null;
  });
  // the note under the bot screen for a person who may play only the bots (the old /play page's)
  const BOTS_NOTE = 'You play with the real rules engine, which runs in this browser tab and downloads while you choose. The bot sees only what its seat sees: your hand and both decks stay hidden from it.';
  const RANDOM = 'random';
  const CUSTOM_KEY = 'swu-tables-decks';
  const SESSION_KEY = 'swu-tables-link';
  const STUN = [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun.cloudflare.com:3478' }];
  let info = null;
  let saving = 0;
  let playing = false;

  // ---------------------------------------------------------------- the bar
  function status(text, tone = 'idle') {
    $('status').dataset.tone = tone;
    $('status').lastElementChild.textContent = text;
  }
  function progress(frac) {
    $('progress').hidden = frac == null;
    if (frac != null) $('progress').firstElementChild.style.width = `${Math.round(Math.max(0, Math.min(1, frac)) * 100)}%`;
  }
  const mb = (n) => `${(n / 1048576).toFixed(n > 10485760 ? 0 : 1)} MB`;

  function show(which) {
    $('table').hidden = which !== 'table';
    $('viewer-wrap').hidden = which !== 'viewer';
    $('games').hidden = which !== 'games';
    $('games-btn').hidden = which === 'games' || !info;
    window.scrollTo(0, 0);
  }
  let viewer = null;
  let backTo = 'table';
  function watch(jsonl) {
    viewer?.destroy?.();
    show('viewer');
    viewer = SWUViewer.mount($('viewer'), { jsonl, follow: false });
  }
  $('back').onclick = () => { viewer?.destroy?.(); viewer = null; show(backTo); };
  $('games-back').onclick = () => show('table');
  $('games-btn').onclick = () => { loadGames(); show('games'); };

  const when = (iso) => {
    const d = new Date(iso);
    return Number.isNaN(d.getTime()) ? '' : d.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' });
  };
  function gameRow(g, admin) {
    const row = document.createElement('div');
    row.className = 'game';
    const head = document.createElement('div');
    const p = (s) => (admin && g.people?.[s] ? `${g[s]} (${g.people[s]})` : g[s]);
    if (admin || g.won === null) {
      head.className = 'head';
      head.textContent = g.outcome === 'won' ? `${p(g.winnerSeat)} beat ${p(g.winnerSeat === 'p1' ? 'p2' : 'p1')}${g.conceded ? ' (conceded)' : ''}` : g.outcome === 'draw' ? `${p('p1')} and ${p('p2')}: a draw` : `${p('p1')} and ${p('p2')}: no result`;
    } else {
      head.className = `head ${g.won ? 'won' : g.outcome === 'won' ? 'lost' : ''}`;
      head.textContent = g.outcome !== 'won' ? `No result against ${g.opponent}` : g.won ? `You beat ${g.opponent}${g.conceded ? ' (they conceded)' : ''}` : `${g.opponent} beat you${g.conceded ? ' (you conceded)' : ''}`;
    }
    const meta = document.createElement('div');
    meta.className = 'meta';
    // your deck first in your own games
    const [a, z] = !admin && g.seat === 'p2' ? ['p2', 'p1'] : ['p1', 'p2'];
    meta.textContent = `${when(g.playedAt)} · ${g.decks?.[a] ?? '?'} against ${g.decks?.[z] ?? '?'} · round ${g.rounds ?? '?'}, ${g.steps ?? '?'} moves`;
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = 'Watch';
    b.onclick = async () => {
      b.disabled = true;
      try {
        const r = await fetch(`/api/tables/games/${encodeURIComponent(g.id)}.jsonl`);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        backTo = 'games';
        watch(await r.text());
      } catch (e) {
        status(`Could not load that game: ${e.message}`, 'bad');
      } finally {
        b.disabled = false;
      }
    };
    row.append(head, b, meta);
    return row;
  }
  async function loadGames() {
    let j = null;
    try {
      j = (await api('GET', '/api/tables/games'));
    } catch (e) {
      status(`Could not load your games: ${e.message}`, 'bad');
    }
    const mine = $('mine');
    mine.replaceChildren(...(j?.games ?? []).map((g) => gameRow(g, false)));
    if (!mine.children.length) {
      const p = document.createElement('p');
      p.textContent = 'No games yet.';
      mine.append(p);
    }
    const all = j?.all ?? null;
    $('all-h').hidden = $('all').hidden = !all;
    if (all) $('all').replaceChildren(...all.map((g) => gameRow(g, true)));
  }

  async function api(method, path, body) {
    const r = await fetch(path, { method, headers: { accept: 'application/json', ...(body !== undefined ? { 'content-type': 'application/json' } : {}) }, body: body === undefined ? undefined : JSON.stringify(body) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok) {
      const e = new Error(j.error?.message || `HTTP ${r.status}`);
      e.status = r.status;
      throw e;
    }
    return j.result;
  }

  // ---------------------------------------------------------------- decks: the lists, and decks people added
  let custom = [];
  try { custom = JSON.parse(localStorage.getItem(CUSTOM_KEY) || '[]').filter((d) => d && d.metadata && d.leader && d.base && Array.isArray(d.deck)); } catch { custom = []; }
  const saveCustom = () => { try { localStorage.setItem(CUSTOM_KEY, JSON.stringify(custom.slice(-20))); } catch { /* kept for this visit only */ } };
  const optionOf = (d) => ({ name: d.metadata.name, leader: d.leader.id, base: d.base.id, style: d.metadata.style ?? null });
  /** What a game takes for a deck name: a list's name, or the deck itself for one people added. */
  const deckRef = (name) => (!name || name === RANDOM ? name : custom.find((d) => d.metadata.name === name) ?? name);

  // ---------------------------------------------------------------- downloads (the old /play page's): each file once,
  // shared by whatever needs it. The engine starts as soon as the page has its file list, since every game needs it; a
  // bot's own files come while the versus screen shows that bot (table.prepare) or a game against it starts, and stop
  // when nobody wants them, so looking through the bots does not fetch them all.
  const size = (n) => (n == null ? '?' : n < 1048576 ? `${Math.max(1, Math.round(n / 1024))} KB` : `${(n / 1048576).toFixed(n < 104857600 ? 1 : 0)} MB`);
  const sleep = (ms, signal) => new Promise((ok, no) => {
    const t = setTimeout(ok, ms);
    signal?.addEventListener('abort', () => { clearTimeout(t); no(new DOMException('cancelled', 'AbortError')); }, { once: true });
  });
  const tab = {
    worker: null, // the tables worker, made once the engine is here
    up: false, // the worker said ready
    fetched: new Set(), // URLs downloaded in this tab
    bytes: new Map(), // URL -> bytes downloaded and not yet given to the worker
    sent: new Set() // what the worker has: 'jepa' (its models), a bundle's sha256, 'python'
  };
  /** A downloaded file's bytes, handed over: a failed hand-over downloads it again. */
  const take = (url) => {
    const b = tab.bytes.get(url);
    tab.bytes.delete(url);
    tab.fetched.delete(url);
    return b;
  };

  // ---- the opponents
  const titleOf = (bot) => bot.title || bot.name;
  const byName = (name) => info.bots.find((b) => b.name === name) ?? null;
  // an interpreter an arena bot needs (null: none, or this arena does not have it)
  const runtimeOf = (bot) => (bot.kind === 'arena' && bot.runtime && bot.runtime !== 'wasi-p1' ? info.runtimes?.[bot.runtime] ?? null : null);
  function unavailable(bot) {
    if (bot.kind !== 'arena') return null;
    if (!window.crossOriginIsolated) return 'This browser cannot run arena bots on this page. Recent Chrome, Edge, Firefox and Safari can.';
    if (bot.runtime !== 'wasi-p1' && !runtimeOf(bot)) return `It needs the ${bot.runtime} runtime, which this arena does not have yet.`;
    return null;
  }
  // the line under a bot's name on the versus screen
  function noteOf(bot) {
    if (bot.kind === 'jepa') return bot.about || null;
    const parts = [info.round != null ? `round ${info.round}` : null, bot.runtime === 'wasi-p1' ? 'WebAssembly' : bot.runtime ? 'Python' : null, bot.capMs ? `${Math.round(bot.capMs / 1000)} s a game` : null];
    return parts.filter(Boolean).join(' · ') || null;
  }
  const ENGINE_ONLY = { kind: 'engine' };
  /**
   * What a game against this bot needs that the worker does not have yet: [{group, url, bytes, wire, keep}], downloaded
   * in this tab or not. bytes: the file as the page reads it (unzipped); wire: about what it downloads (gzipped); keep:
   * the bytes go to the worker. The engine's files leave the list once the worker is made.
   */
  function filesOf(bot) {
    const out = [];
    if (!info.ready) return out; // the games machine is waking up: the file list comes with it
    const add = (group, f, keep) => {
      if (f && !out.some((x) => x.url === f.url)) out.push({ group, url: f.url, bytes: f.bytes ?? null, wire: f.wire ?? f.bytes ?? null, keep });
    };
    if (!tab.worker) {
      add('Rules engine', info.files.pack, true);
      add('Rules engine', info.files.worker, false);
    }
    if (bot.kind === 'jepa' && !tab.sent.has('jepa')) {
      for (const f of bot.files ?? []) add(`${titleOf(bot)}: its models`, f, true);
    }
    if (bot.kind === 'arena') {
      add('Bot runner', info.files.botWorker, false);
      if (!tab.sent.has(bot.bundle.hex)) add(titleOf(bot), bot.bundle, true);
      const rt = runtimeOf(bot);
      if (rt && !tab.sent.has('python')) {
        add('Python for bots', rt.lib, true);
        add('Python for bots', rt.wasm, true);
      }
    }
    return out;
  }
  // the files every game shares: they keep downloading whoever stops looking
  const shared = (url) => !!info.files && [info.files.pack, info.files.worker, info.files.botWorker].some((f) => f.url === url);
  const sum = (items) => items.reduce((a, x) => a + (x.wire ?? x.bytes ?? 0), 0);

  const loads = new Map(); // url -> {it, got, raw, wire, waiting, error, ctl, want, promise}
  const watchers = new Set(); // functions that report progress (prepare, and the bar while the engine comes)
  let pinged = false;
  function ping() {
    if (pinged) return;
    pinged = true;
    setTimeout(() => {
      pinged = false;
      for (const w of watchers) w();
    }, 150);
  }
  /** Starts a file's download, or joins the one under way; {promise} settles when the tab has it. */
  function load(it) {
    if (tab.fetched.has(it.url)) return { promise: Promise.resolve() };
    const had = loads.get(it.url);
    if (had && !had.error) return had;
    const l = { it, got: 0, raw: it.bytes, wire: it.wire, waiting: false, error: null, ctl: new AbortController(), want: had?.want ?? 0, promise: null };
    loads.set(it.url, l);
    l.promise = download(l).then(() => {
      loads.delete(it.url);
      ping();
    }, (e) => {
      if (l.ctl.signal.aborted) {
        if (loads.get(it.url) === l) loads.delete(it.url);
      } else {
        l.error = String(e?.message || e);
        console.error('[tables]', l.error);
      }
      ping();
      throw e;
    });
    l.promise.catch(() => undefined);
    return l;
  }
  /** Keeps a bot's own files downloading while someone wants them: the returned function lets go. */
  function want(bot) {
    const urls = filesOf(bot).filter((it) => !shared(it.url)).map((it) => it.url);
    for (const it of filesOf(bot)) {
      const l = load(it);
      if (!shared(it.url) && l.ctl) l.want++;
    }
    return () => {
      for (const u of urls) {
        const l = loads.get(u);
        if (l && --l.want <= 0 && !l.error) l.ctl.abort();
      }
    };
  }
  /** Downloads one file, counting its bytes as they come (unzipped: x-raw-length is the total). */
  async function download(l) {
    const it = l.it;
    const signal = l.ctl.signal;
    for (let tries = 0; ; tries++) {
      const r = await fetch(it.url, { signal });
      if (r.status === 503 && tries < 18) {
        // a bundle the window has not kept yet comes from the games machine, which may be asleep
        l.waiting = true;
        ping();
        await sleep(10000, signal);
        continue;
      }
      if (!r.ok) {
        const j = await r.json().catch(() => null);
        throw new Error(`${it.group}: ${j?.error?.message || `HTTP ${r.status}`}`);
      }
      l.waiting = false;
      // x-raw-length: the file unzipped, what the body gives; content-length: what comes down the line
      const raw = Number(r.headers.get('x-raw-length'));
      if (raw > 0) {
        l.raw = raw;
        l.wire = Number(r.headers.get('content-length')) || l.wire;
      }
      const chunks = [];
      let n = 0;
      if (r.body?.getReader) {
        const reader = r.body.getReader();
        for (;;) {
          const { done, value } = await reader.read();
          if (done) break;
          chunks.push(value);
          n += value.length;
          l.got = n;
          ping();
        }
      } else {
        const b = new Uint8Array(await r.arrayBuffer());
        chunks.push(b);
        n = b.length;
        l.got = n;
      }
      if (raw > 0 && n !== raw) throw new Error(`${it.group}: the download was cut off (${size(n)} of ${size(raw)})`);
      if (it.keep) {
        const out = new Uint8Array(n);
        let o = 0;
        for (const c of chunks) {
          out.set(c, o);
          o += c.length;
        }
        tab.bytes.set(it.url, out);
      }
      tab.fetched.add(it.url);
      return;
    }
  }
  /** Where a bot's files are, as Holotable's Prep: all here and the engine started, or what is left of the total. */
  function prepOf(bot) {
    if (!info.ready) return { ready: false, left: null, total: null, waiting: true, note: wakeNote(), error: engineError };
    let total = 0;
    let got = 0;
    let known = true;
    let waiting = false;
    let error = null;
    for (const it of filesOf(bot)) {
      const l = loads.get(it.url);
      const wire = l?.wire ?? it.wire;
      if (wire == null) {
        known = false;
        continue;
      }
      const raw = l?.raw ?? it.bytes;
      total += wire;
      got += tab.fetched.has(it.url) ? wire : l && raw ? wire * Math.min(1, l.got / raw) : 0;
      waiting = waiting || !!l?.waiting;
      error = error || l?.error || null;
    }
    const ready = tab.up && filesOf(bot).every((it) => tab.fetched.has(it.url));
    return { ready, left: known ? Math.max(0, Math.round(total - got)) : null, total: known ? Math.round(total) : null, waiting, error: error || engineError };
  }

  // ---- the game files come from the games machine. The window keeps the last build's on its disk, so they load while
  // the machine sleeps; after a new build (or a lost disk) the screen opens anyway and waits for the machine to wake up,
  // saying how long (Holotable's loading bar under Play)
  let waking = null;
  let wokeAt = null;
  let pressed = 0; // games asked for that still wait for files: the screen that owns them stays mounted
  let pairing = 0; // pairings open (Table.pair): their panel stays mounted too
  let mounted = null;
  const clock = (ms) => `${Math.floor(ms / 60000)}:${String(Math.floor(ms / 1000) % 60).padStart(2, '0')}`;
  function wakeNote() {
    if (wokeAt === null) return 'Waking the games machine';
    const ms = Date.now() - wokeAt;
    return `Waking the games machine · ${clock(ms)} ${ms < 90000 ? 'of ~1:00' : '(slow today)'}`;
  }
  /** Settles once the window has the game files (info.ready), with the bots' files listed again; polls meanwhile. */
  function filesReady() {
    if (info.ready) return Promise.resolve();
    if (!waking) {
      wokeAt = Date.now();
      const tick = setInterval(ping, 1000);
      status(`Waking the games machine. Pick ${info.people.length ? 'a way to play, ' : ''}your opponent and your deck meanwhile.`, 'busy');
      waking = (async () => {
        try {
          for (let tries = 0; ; tries++) {
            await sleep(4000);
            const next = await api('GET', '/api/tables/info').catch(() => null);
            if (next?.ready) {
              const had = info.bots.map((b) => b.name).join();
              info = next;
              // the JEPA bot's models are files of the build, so it is listed only now: the screen shows it
              if (info.bots.map((b) => b.name).join() !== had && mounted && !playing && !pressed && !pairing) {
                mounted.destroy();
                mounted = SWUViewer.mountPlay($('table'), { table });
              }
              return;
            }
            if (tries >= 75) throw new Error('The games machine did not wake up. Try again in a few minutes.');
          }
        } finally {
          clearInterval(tick);
          wokeAt = null;
          ping();
        }
      })();
      waking.catch((e) => {
        waking = null;
        engineError = String(e?.message || e);
        status(engineError, 'bad');
        ping();
      });
    }
    return waking;
  }

  // ---------------------------------------------------------------- the engine: tables-worker.js, started once its
  // files are here; the bar shows it coming
  let engine = null;
  let engineError = null;
  function engineBar() {
    if (tab.worker || engineError || playing) {
      progress(null);
      watchers.delete(engineBar);
      return;
    }
    const p = prepOf(ENGINE_ONLY);
    if (p.total) {
      progress((p.total - p.left) / p.total);
      status(`Downloading the rules engine: ${size(p.total - p.left)} of ${size(p.total)}`, 'busy');
    }
  }
  function loadEngine() {
    if (!engine) {
      engineError = null;
      watchers.add(engineBar);
      engine = (async () => {
        await filesReady();
        const t0 = performance.now();
        await Promise.all(filesOf(ENGINE_ONLY).map((it) => load(it).promise));
        return startEngine(t0);
      })();
      engine.catch((e) => {
        engine = null;
        engineError = String(e?.message || e);
        progress(null);
        ping();
      });
    }
    return engine;
  }
  async function startEngine(t0) {
    progress(null);
    status('Starting the rules engine…', 'busy');
    const pack = take(info.files.pack.url);
    const worker = new Worker(info.files.worker.url);
    tab.worker = worker;
    const waits = { ready: null, started: null, deck: new Map(), bot: new Map(), acted: [] };
    const handlers = { msg: () => undefined, peer: () => undefined, peerActed: () => undefined };
    const ready = new Promise((ok, no) => { waits.ready = { ok, no }; });
    worker.onmessage = (e) => {
      const m = e.data;
      if (m.t === 'ready') {
        if (m.cardText) SWUViewer.loadCardText(m.cardText);
        waits.ready.ok(m);
      } else if (m.t === 'started' || m.t === 'refused') {
        const w = waits.started;
        waits.started = null;
        if (m.t === 'started' && m.cardText) SWUViewer.loadCardText(m.cardText);
        if (w) m.t === 'started' ? w.ok(m) : w.no(new Error(m.error));
      } else if (m.t === 'botReady') {
        const w = waits.bot.get(m.name);
        waits.bot.delete(m.name);
        if (w) m.error ? w.no(new Error(m.error)) : w.ok();
      } else if (m.t === 'deckChecked') {
        const w = waits.deck.get(m.n);
        waits.deck.delete(m.n);
        if (w) m.error ? w.no(new Error(m.error)) : w.ok(m.deck);
      } else if (m.t === 'acted') {
        const a = waits.acted.shift();
        if (a) m.error ? a.no(new Error(m.error)) : a.ok({ ok: true });
      } else if (m.t === 'msg') {
        handlers.msg(m.msg);
      } else if (m.t === 'peer') {
        handlers.peer(m.msg);
      } else if (m.t === 'peerActed') {
        handlers.peerActed(m);
      } else if (m.t === 'error') {
        console.error('[tables]', m.message);
        waits.ready.no(new Error(String(m.message).split('\n')[0]));
        handlers.msg({ t: 'fatal', error: String(m.message).split('\n')[0] });
      }
    };
    worker.onerror = (e) => waits.ready.no(new Error(e.message || 'the game worker did not start'));
    // Python comes with the first Python bot (eng.bot); the URLs are the worker's own way to fetch it
    const py = info.runtimes ? Object.values(info.runtimes)[0] : null;
    worker.postMessage({ t: 'init', packBytes: pack, botWorker: info.files.botWorker.url, pythonLib: py?.lib.url, pythonWasm: py?.wasm.url }, [pack.buffer]);
    let r;
    try {
      r = await ready;
    } catch (e) {
      // a failed start leaves nothing behind: the next try downloads the engine and starts a new worker
      worker.terminate();
      tab.worker = null;
      throw e;
    }
    tab.up = true;
    ping();
    status(`Rules engine ready (${Math.round((performance.now() - t0) / 1000)} s).`, 'good');
    let n = 0;
    return {
      worker, handlers, isolated: r.isolated,
      // files: [[path, bytes]] for the worker's disk (the JEPA bot's models, with the first game against it)
      start: (game, files) => new Promise((ok, no) => {
        if (waits.started) return no(new Error('a game is starting'));
        waits.started = { ok, no };
        worker.postMessage({ t: 'start', game, ...(files ? { files } : {}) });
      }),
      // an arena version's bundle, and Python's files with the first Python bot (all handed over to the worker)
      bot: (name, hex, tar, capMs, python) => new Promise((ok, no) => {
        waits.bot.set(name, { ok, no });
        worker.postMessage({ t: 'bot', name, hex, tar, capMs, ...(python ? { python } : {}) }, [tar.buffer, ...(python ? [python.lib.buffer, python.wasm.buffer] : [])]);
      }),
      checkDeck: (deck) => new Promise((ok, no) => {
        const k = ++n;
        waits.deck.set(k, { ok, no });
        worker.postMessage({ t: 'checkDeck', n: k, deck });
      }),
      act: (act) => new Promise((ok, no) => {
        waits.acted.push({ ok, no });
        worker.postMessage({ t: 'act', act });
      }),
      peerAct: (n2, act) => worker.postMessage({ t: 'peerAct', n: n2, act }),
      concede: () => worker.postMessage({ t: 'concede' }),
      peerConcede: () => worker.postMessage({ t: 'peerConcede' })
    };
  }

  /**
   * Gives the worker what a game against this bot needs that it does not have yet: an arena version's bundle (and
   * Python, with the first Python bot). Returns the JEPA bot's models for the start message, or null.
   */
  async function readyBot(eng, bot) {
    if (bot.kind === 'arena' && !tab.sent.has(bot.bundle.hex)) {
      if (!eng.isolated) throw new Error(unavailable(bot) || 'this browser cannot run arena bots here');
      const rt = runtimeOf(bot);
      const python = rt && !tab.sent.has('python') ? { lib: take(rt.lib.url), wasm: take(rt.wasm.url) } : null;
      await eng.bot(bot.name, bot.bundle.hex, take(bot.bundle.url), bot.capMs, python);
      tab.sent.add(bot.bundle.hex);
      if (python) tab.sent.add('python');
    }
    return bot.kind === 'jepa' && !tab.sent.has('jepa') ? (bot.files ?? []).map((f) => [f.path, tab.bytes.get(f.url)]) : null;
  }

  // ---------------------------------------------------------------- games this page follows (Holotable's Table.follow)
  const games = new Map(); // id -> {msgs, subs, replay, url, seat, kind}
  function newGame(id, seat, kind) {
    const g = { id, seat, kind, msgs: [], subs: new Set(), replay: null, url: null, over: false };
    games.set(id, g);
    return g;
  }
  function deliver(g, m) {
    if (g.dropped) return; // ended in this tab when its link closed for good (dropGame)
    if (m.t === 'end') {
      g.over = true;
      playing = false;
      const links = g.links?.() ?? [];
      // a while after the end, once the guest says it has the end (a host) or what this tab still sends has gone
      setTimeout(async () => {
        const sent = g.settled ? g.settled() : Promise.all(links.map((l) => l?.idle?.()));
        await Promise.race([sent, new Promise((ok) => setTimeout(ok, 300000))]);
        for (const l of links) l?.close?.();
      }, 15000);
      if (g.cancelled) {
        // a game cancelled while it was dealt: nothing to keep
      } else if (m.replay) {
        g.replay = m.replay;
        g.url = URL.createObjectURL(new Blob([m.replay], { type: 'application/x-ndjson' }));
        save(m.replay, g.seat);
      } else {
        status('The game stopped before it could be saved.', 'bad');
      }
    }
    if (m.t === 'fatal') {
      playing = false;
      status(`The game stopped: ${m.error}. Reload the page to play again.`, 'bad');
      for (const s of g.subs) s.onError(true);
      return;
    }
    g.msgs.push(m);
    for (const s of g.subs) s.onMsg(m);
  }
  /**
   * The link to the other player closed and nothing can take its place (a game linked by codes, or the lobby's room
   * gone): the game cannot go on, so it ends here with no winner, and nothing is kept.
   */
  function dropGame(g, why) {
    if (g.over) return;
    g.dropped = true;
    g.over = true;
    playing = false;
    status(`The game stopped: ${why}. It was not saved.`, 'bad');
    const end = { t: 'end', winner: null, outcome: 'ERROR', round: null, steps: null, error: why, conceded: false, concededBy: null, replay: null };
    g.msgs.push(end);
    for (const s of g.subs) s.onMsg(end);
    for (const l of g.links?.() ?? []) l?.close?.();
  }
  async function save(replay, seat) {
    saving++;
    status('Saving the game…', 'busy');
    try {
      for (let i = 0; i < 5; i++) {
        try {
          await api('POST', '/api/tables/games', { replay, seat });
          status('Saved. It is in your games, unrated.', 'good');
          return;
        } catch (e) {
          if (e.status && e.status < 500) {
            status(`Not saved: ${e.message}. Download the replay to keep it.`, 'bad');
            return;
          }
        }
        await new Promise((ok) => setTimeout(ok, 2000 * 2 ** i));
      }
      status('Not saved: the arena did not answer. Download the replay to keep it.', 'bad');
    } finally {
      saving--;
    }
  }
  window.addEventListener('beforeunload', (e) => {
    if (playing || saving) {
      e.preventDefault();
      e.returnValue = '';
    }
  });

  // ---------------------------------------------------------------- links between two browsers
  // A game message is JSON; a long one (the end, with the replay) goes in parts no bigger than the link takes.
  function framer(sendRaw, size) {
    let next = 0;
    return (obj) => {
      const s = JSON.stringify(obj);
      if (s.length <= size) return sendRaw(s);
      const id = ++next;
      const n = Math.ceil(s.length / size);
      for (let i = 0; i < n; i++) sendRaw(JSON.stringify({ part: id, i, n, s: s.slice(i * size, (i + 1) * size) }));
      return undefined;
    };
  }
  function deframer(onObj) {
    const parts = new Map();
    return (s) => {
      let o;
      try { o = JSON.parse(s); } catch { return; }
      if (o && o.part && typeof o.s === 'string') {
        const p = parts.get(o.part) ?? { got: 0, n: o.n, s: [] };
        if (p.s[o.i] === undefined) { p.s[o.i] = o.s; p.got++; }
        parts.set(o.part, p);
        if (p.got === p.n) {
          parts.delete(o.part);
          try { onObj(JSON.parse(p.s.join(''))); } catch { /* a broken message is dropped */ }
        }
        return;
      }
      onObj(o);
    };
  }

  /** A link's onGame: game messages that come before anyone listens wait for the listener. */
  function gameSink(link) {
    let fn = null;
    const pending = [];
    Object.defineProperty(link, 'onGame', { get: () => fn, set: (f) => { fn = f; while (fn && pending.length) fn(pending.shift()); } });
    return (o) => (fn ? fn(o) : pending.push(o));
  }

  /** The lobby's room as a link: a stream of events and POSTs, in order. */
  function roomLink({ room, side, k }) {
    const q = `room=${encodeURIComponent(room)}&side=${side}&k=${k}`;
    const es = new EventSource(`/api/tables/stream?${q}`);
    const link = { onRoom: () => undefined, onSignal: () => undefined, onDown: () => undefined, closed: false };
    const gameIn = deframer(gameSink(link));
    es.onmessage = (e) => {
      let d;
      try { d = JSON.parse(e.data); } catch { return; }
      if (d.room) link.onRoom(d);
      else if (d.msg && d.msg.sig) link.onSignal(d.msg);
      else if (d.msg && typeof d.msg.g === 'string') gameIn(d.msg.g);
    };
    es.onerror = () => { if (!link.closed && es.readyState === EventSource.CLOSED) link.onDown('the lobby closed the link'); };
    // a stream that comes back (the browser reconnects it) may have missed what the lobby no longer keeps: onReopen
    let opened = false;
    es.onopen = () => {
      if (opened && !link.closed) link.onReopen?.();
      opened = true;
    };
    let chain = Promise.resolve();
    const post = (msg) => {
      chain = chain.then(async () => {
        // in order, each one until the lobby takes it (a lost network or a restarting window only delays it)
        for (let i = 0; !link.closed; i++) {
          try {
            await api('POST', `/api/tables/send?${q}`, { msg });
            return;
          } catch (e) {
            if (e.status >= 400 && e.status < 500) { link.onDown(e.message); return; }
            await new Promise((ok) => setTimeout(ok, Math.min(8000, 500 * 2 ** i)));
          }
        }
      });
      return chain;
    };
    link.signal = (m) => post(m);
    link.idle = () => chain; // settles once every message sent so far has been posted
    // a part is escaped twice on its way (in its part, then in the POST body), so it stays well under the lobby's 256 KB
    link.game = framer((s) => post({ g: s }), 50000);
    link.close = (leave = true) => {
      if (link.closed) return;
      link.closed = true;
      es.close();
      if (leave) chain.then(() => api('POST', `/api/tables/leave?${q}`, {})).catch(() => undefined);
    };
    return link;
  }

  /** Waits for a peer connection's candidates (no trickle: one offer or answer holds them all), at most `ms`. */
  function gathered(pc, ms = 4000) {
    if (pc.iceGatheringState === 'complete') return Promise.resolve();
    return new Promise((ok) => {
      const t = setTimeout(ok, ms);
      pc.addEventListener('icegatheringstatechange', () => { if (pc.iceGatheringState === 'complete') { clearTimeout(t); ok(); } });
    });
  }
  /** A data channel as a game link: ordered and reliable, messages in parts of 16 KB. */
  function channelLink(pc, dc) {
    const link = { onDown: () => undefined, closed: false, kind: 'direct' };
    const gameIn = deframer(gameSink(link));
    dc.onmessage = (e) => gameIn(String(e.data));
    const down = () => { if (!link.closed) link.onDown('the direct link closed'); };
    dc.onclose = down;
    pc.addEventListener('connectionstatechange', () => { if (['failed', 'closed'].includes(pc.connectionState)) down(); });
    // parts wait here while the channel's own buffer holds more than HIGH (a big end message would overflow it)
    const out = [];
    const HIGH = 1 << 20;
    dc.bufferedAmountLowThreshold = HIGH / 2;
    const flush = () => {
      while (out.length && dc.readyState === 'open' && dc.bufferedAmount < HIGH) dc.send(out.shift());
    };
    dc.onbufferedamountlow = flush;
    link.game = framer((s) => { out.push(s); flush(); }, 16000);
    link.idle = () => new Promise((ok) => {
      const check = () => (dc.readyState !== 'open' || (!out.length && dc.bufferedAmount === 0) ? ok() : setTimeout(check, 200));
      check();
    });
    link.close = () => { link.closed = true; try { dc.close(); pc.close(); } catch { /* gone */ } };
    return link;
  }
  const opened = (dc, ms) => new Promise((ok, no) => {
    if (dc.readyState === 'open') return ok();
    const t = setTimeout(() => no(new Error('timeout')), ms);
    dc.addEventListener('open', () => { clearTimeout(t); ok(); });
  });

  /**
   * Links this tab with the other side of a lobby room: a direct WebRTC channel when the two browsers can reach each
   * other, else the room itself carries the game. Resolves to {link, room}; the room stays open as the way back.
   */
  async function connect(room, side, onState, stopped) {
    const r = roomLink(room);
    let peer = room.peer ?? null;
    const pc = new RTCPeerConnection({ iceServers: STUN });
    const result = new Promise((resolve, reject) => {
      let done = false;
      const finish = (link) => { if (!done) { done = true; resolve({ link, room: r, peer, pc }); } };
      stopped?.catch((e) => {
        if (done) return;
        done = true;
        try { pc.close(); } catch { /* gone */ }
        r.close();
        reject(e);
      });
      const viaRoom = () => {
        try { pc.close(); } catch { /* gone */ }
        r.kind = 'relay';
        finish(r);
      };
      r.onDown = (why) => { if (!done) { done = true; reject(new Error(why)); } };
      if (side === 'host') {
        const dc = pc.createDataChannel('swu', { ordered: true });
        const go = async () => {
          onState?.({ text: 'Connecting to the other player…' });
          await pc.setLocalDescription(await pc.createOffer());
          await gathered(pc);
          r.signal({ sig: 'offer', sdp: pc.localDescription.sdp });
          try {
            await opened(dc, 12000);
            r.signal({ sig: 'direct' });
            finish(channelLink(pc, dc));
          } catch {
            r.signal({ sig: 'relay' });
            viaRoom();
          }
        };
        r.onRoom = (d) => { if (d.room === 'joined') { peer = d.peer; go().catch(viaRoom); } else if (d.room === 'left' && !done) { done = true; reject(new Error('the other player left')); } };
        r.onSignal = async (m) => { if (m.sig === 'answer') await pc.setRemoteDescription({ type: 'answer', sdp: m.sdp }).catch(() => undefined); };
        if (room.peer) go().catch(viaRoom);
      } else {
        let dc = null;
        pc.ondatachannel = (e) => { dc = e.channel; };
        r.onRoom = (d) => { if (d.room === 'left' && !done) { done = true; reject(new Error('the other player left')); } };
        r.onSignal = async (m) => {
          if (m.sig === 'offer') {
            onState?.({ text: 'Connecting to the other player…' });
            await pc.setRemoteDescription({ type: 'offer', sdp: m.sdp });
            await pc.setLocalDescription(await pc.createAnswer());
            await gathered(pc);
            r.signal({ sig: 'answer', sdp: pc.localDescription.sdp });
          } else if (m.sig === 'direct') {
            const wait = () => (dc ? opened(dc, 8000) : new Promise((ok) => setTimeout(ok, 200)).then(wait));
            wait().then(() => finish(channelLink(pc, dc)), viaRoom);
          } else if (m.sig === 'relay') {
            viaRoom();
          }
        };
      }
    });
    return result;
  }

  // pasted codes, no lobby: the offer and the answer, compressed (CompressionStream) and in base64url
  async function pack(obj, prefix) {
    const data = new TextEncoder().encode(JSON.stringify(obj));
    const cs = new Blob([data]).stream().pipeThrough(new CompressionStream('deflate-raw'));
    const bytes = new Uint8Array(await new Response(cs).arrayBuffer());
    let s = '';
    for (const b of bytes) s += String.fromCharCode(b);
    return `${prefix}${btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '')}`;
  }
  async function unpackCode(code, prefix) {
    const s = String(code).trim().replace(/\s+/g, '');
    if (!s.startsWith(prefix)) throw new Error('that is not the right code');
    const b = atob(s.slice(prefix.length).replace(/-/g, '+').replace(/_/g, '/'));
    const bytes = Uint8Array.from(b, (c) => c.charCodeAt(0));
    const ds = new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
    return JSON.parse(await new Response(ds).text());
  }
  const OFFER = 'SWU1.';
  const ANSWER = 'SWU1A.';

  // ---------------------------------------------------------------- one people game, either side
  /**
   * The host: plays the game in this tab's worker. The guest's messages are numbered and kept, so a guest who comes
   * back (a new link, a reload) asks for what it missed. Resolves once the game started.
   */
  async function hostGame(link, peerPid, deckName, setLink, wanted = () => true) {
    let joined = null;
    let joinedWait = null;
    const log = []; // every message for the guest, numbered from 1
    let lastAct = 0; // the guest numbers its actions and sends unanswered ones again on a new link
    let g = null;
    let guestHas = 0; // the last message the guest said it has (resume, got)
    let endAt = 0; // the end's number in the log
    let gotEnd = null;
    let gone = null; // the link closed for good before the game started
    const received = new Promise((ok) => { gotEnd = ok; });
    const heard = (n) => {
      guestHas = Math.max(guestHas, n);
      if (endAt && guestHas >= endAt) gotEnd();
    };
    const toGuest = (m) => {
      log.push(m);
      if (m.t === 'msg' && m.msg?.t === 'end') endAt = log.length;
      cur.game({ n: log.length, m });
    };
    let cur = link;
    const attach = (l) => {
      cur = l;
      l.onGame = (o) => {
        if (o.t === 'join' && !joined) {
          joined = o;
        } else if (o.t === 'join' || o.t === 'resume') {
          if (o.t === 'join') { lastAct = 0; guestHas = 0; } // a new page numbers its actions from 1 again
          else heard(o.have ?? 0);
          for (let i = (o.have ?? 0); i < log.length; i++) l.game({ n: i + 1, m: log[i] });
        } else if (o.t === 'act' && g && !g.over && Number.isInteger(o.a) && o.a > lastAct) {
          lastAct = o.a;
          eng.peerAct(o.a, o.act);
        } else if (o.t === 'concede' && g && !g.over) {
          eng.peerConcede();
        } else if (o.t === 'got' && Number.isInteger(o.have)) {
          heard(o.have);
        }
        joinedWait?.();
      };
      // only a link nothing can replace gets here (lobbyGame moves a dropped direct link to the room): the game ends
      l.onDown = (why) => {
        if (cur !== l) return;
        const text = `${why}, and this game cannot reconnect`;
        if (g && !g.over) {
          dropGame(g, text);
          eng.concede(); // the worker's game ends too, so the table takes the next one
        } else if (!g) {
          gone = new Error(text);
          joinedWait?.();
        }
      };
      l.onReopen = () => { if (cur === l) l.game({ t: 'again' }); };
    };
    attach(link);
    setLink?.(attach);
    let eng;
    try {
      eng = await loadEngine();
    } catch (e) {
      toGuest({ t: 'refused', error: `the host's rules engine did not start (${e.message})` });
      throw e;
    }
    if (!wanted()) throw new Error('cancelled');
    if (gone) throw gone;
    if (!joined) {
      await new Promise((ok, no) => {
        const t = setTimeout(() => {
          toGuest({ t: 'refused', error: 'the host never got your deck' });
          no(new Error('the other player did not send their deck'));
        }, 60000);
        joinedWait = () => {
          if (gone) { clearTimeout(t); joinedWait = null; no(gone); }
          else if (joined) { clearTimeout(t); joinedWait = null; ok(); }
        };
      });
    }
    if (!wanted()) throw new Error('cancelled');
    eng.handlers.peer = (m) => toGuest({ t: 'msg', msg: m });
    eng.handlers.peerActed = (m) => toGuest({ t: 'acted', a: m.n, error: m.error });
    const early = [];
    eng.handlers.msg = (m) => (g ? deliver(g, m) : early.push(m));
    let st;
    try {
      st = await eng.start({ mode: 'people', deck: deckRef(deckName), peerDeck: joined.deck, you: info.you, peer: peerPid });
    } catch (e) {
      toGuest({ t: 'refused', error: e.message });
      throw e;
    }
    if (!wanted() || gone) {
      // cancelled, or the link closed for good, while the worker dealt: end it there (the table takes one game at a
      // time), and keep nothing
      eng.concede();
      throw gone ?? new Error('cancelled');
    }
    g = newGame(st.id, st.seat, 'host');
    g.links = () => [cur];
    g.settled = () => received;
    for (const m of early) deliver(g, m);
    g.act = (act) => eng.act(act);
    g.concede = () => eng.concede();
    toGuest({ t: 'start', id: st.id, seat: st.peerSeat, opponent: info.you, cardText: st.cardText });
    playing = true;
    return { id: st.id, seat: st.seat, opponent: peerPid };
  }

  /**
   * The guest: sends its deck, then draws the game the host's tab plays. Resolves once the game started. setLink gets a
   * function that moves the game to another link, which asks the host for what it missed.
   */
  function guestGame(link, peerPid, deckName, setLink) {
    return new Promise((ok, no) => {
      let have = 0;
      let g = null;
      let a = 0;
      let conceded = false; // sent again on a new link until the end comes
      const acts = new Map(); // actions the host has not answered yet, by number
      let cur = link;
      // what the host may never have had: the join before the start, else where this tab is, then unanswered actions
      const sendAgain = (l) => {
        l.game(g ? { t: 'resume', have } : joinMsg);
        for (const [k, w] of acts) l.game({ t: 'act', a: k, act: w.act });
        if (conceded && g && !g.over) l.game({ t: 'concede' });
      };
      const attach = (l, again = false) => {
        cur = l;
        l.onReopen = () => { if (cur === l) sendAgain(l); };
        l.onGame = (o) => {
          if (o?.t === 'again') { if (cur === l) sendAgain(l); return; }
          if (!o || !Number.isInteger(o.n) || o.n <= have) return;
          if (o.n !== have + 1) { l.game({ t: 'resume', have }); return; }
          have = o.n;
          const m = o.m;
          if (m.t === 'refused') { no(new Error(`the host's table refused: ${m.error}`)); return; }
          if (m.t === 'start') {
            if (m.cardText) SWUViewer.loadCardText(m.cardText);
            g = newGame(m.id, m.seat, 'guest');
            g.links = () => [cur];
            g.act = (act) => new Promise((ok2, no2) => {
              const k = ++a;
              acts.set(k, { ok: ok2, no: no2, act });
              cur.game({ t: 'act', a: k, act });
            });
            g.concede = () => { conceded = true; cur.game({ t: 'concede' }); };
            playing = true;
            ok({ id: m.id, seat: m.seat, opponent: m.opponent || peerPid });
          } else if (m.t === 'msg' && g) {
            deliver(g, m.msg);
            if (m.msg.t === 'end') cur.game({ t: 'got', have });
          } else if (m.t === 'acted') {
            const w = acts.get(m.a);
            acts.delete(m.a);
            if (w) m.error ? w.no(new Error(m.error)) : w.ok({ ok: true });
          }
        };
        // only a link nothing can replace gets here (lobbyGame moves a dropped direct link to the room): the game ends
        l.onDown = (why) => {
          if (cur !== l) return;
          const text = `${why}, and this game cannot reconnect`;
          if (g && !g.over) {
            for (const w of acts.values()) w.no(new Error(text));
            acts.clear();
            dropGame(g, text);
          } else if (!g) {
            no(new Error(text));
          }
        };
        if (again) {
          // what the host sent and this tab missed (before the start, the join, which the host may never have had),
          // then the actions it may never have had (it plays each one once)
          sendAgain(l);
        }
      };
      const joinMsg = { t: 'join', v: 1, deck: deckRef(deckName), have: 0 };
      attach(link);
      setLink?.((l) => attach(l, true));
      link.game(joinMsg);
    });
  }

  // ---------------------------------------------------------------- pairing (Holotable's Table.pair)
  /** Links and starts a game in a lobby room; setCancel gets what Cancel does until the game has started. */
  async function lobbyGame(room, side, deck, onState, setCancel) {
    let stop;
    let halted = false;
    const stopped = new Promise((_, no) => { stop = (e) => { halted = true; no(e); }; });
    stopped.catch(() => undefined);
    let c = null;
    setCancel(() => {
      if (c) { c.link.close(); c.room.close(); }
      stop(new Error('cancelled'));
    });
    c = await connect(room, side, onState, stopped);
    const peer = c.peer ?? room.peer;
    const how = c.link === c.room ? 'through the lobby' : 'directly';
    onState({ text: side === 'host' ? `Linked ${how} with ${peer}. Dealing…` : `Linked ${how} with ${peer}. Waiting for the host's table…` });
    let move = null;
    let id = null;
    let viaRoom = c.link === c.room; // the game goes through the room (from the start, or since the direct link dropped)
    const starting = side === 'host' ? hostGame(c.link, peer, deck, (fn) => { move = fn; }, () => !halted) : guestGame(c.link, peer, deck, (fn) => { move = fn; });
    // the room stays as the way back: a direct link that drops goes on through the lobby, on both sides, from the start
    // (after the end too on the host's side: the end and its replay may still be on their way to the guest)
    if (c.link !== c.room) {
      c.link.onDown = () => {
        const over = id && games.get(id)?.over;
        if (over && side === 'guest') return;
        if (!over) status('The direct link dropped: going on through the lobby.', 'busy');
        c.room.onSignal = () => undefined;
        viaRoom = true;
        move(c.room);
      };
    }
    c.room.onRoom = (d) => {
      if (d.room !== 'left') return;
      if (!id) stop(new Error('the other player left'));
      else if (!games.get(id)?.over) {
        // the other player closed its links for good (a tab leaves only once its game is over there), so nothing
        // more can come: the room ends the game as any link that cannot come back does
        if (!viaRoom) { viaRoom = true; move(c.room); }
        c.room.onDown(`${peer} left the table`);
      }
    };
    const game = await Promise.race([starting, stopped]).catch(async (e) => {
      await Promise.race([c.link.idle?.(), new Promise((ok) => setTimeout(ok, 5000))]);
      c.link.close();
      c.room.close();
      throw e;
    });
    id = game.id;
    setCancel(() => undefined);
    const g = games.get(game.id);
    if (g) g.links = () => [c.link, c.room];
    status(`Playing ${peer}, linked ${how}.`, 'good');
    return game;
  }

  function pair(req, onState) {
    let cancel = () => undefined;
    let cancelled = false;
    let answerFn = null;
    const setCancel = (fn) => { cancel = fn; if (cancelled) fn(); };
    const done = (async () => {
      if (req.how === 'invite') {
        const room = await api('POST', '/api/tables/invite', {});
        const link = `${location.origin}/tables#join=${room.code}`;
        onState({ text: 'Send your friend this link or code. The game starts when they join.', code: room.code, link });
        cancel = () => api('POST', `/api/tables/leave?room=${room.room}&side=host&k=${room.k}`, {}).catch(() => undefined);
        loadEngine().catch(() => undefined);
        return lobbyGame({ room: room.room, side: 'host', k: room.k }, 'host', req.deck, onState, setCancel);
      }
      if (req.how === 'join') {
        const text = String(req.code || '').trim();
        if (text.startsWith(OFFER)) return directJoin(text, req.deck, onState, setCancel);
        const m = /(?:#|[?&])join=([A-Za-z0-9]{6})\b/.exec(text) || /^([A-Za-z0-9]{6})$/.exec(text);
        if (!m) throw new Error('paste the invite link, the 6-letter code, or a code that starts with SWU1.');
        onState({ text: 'Joining…' });
        const room = await api('POST', '/api/tables/join', { code: m[1].toUpperCase() });
        return lobbyGame({ room: room.room, side: 'guest', k: room.k, peer: room.peer }, 'guest', req.deck, onState, setCancel);
      }
      if (req.how === 'lobby') {
        const t = await api('POST', '/api/tables/queue', {});
        onState({ text: 'Looking for another player…' });
        loadEngine().catch(() => undefined);
        const paired = await new Promise((ok, no) => {
          const es = new EventSource(`/api/tables/stream?ticket=${t.ticket}&k=${t.k}`);
          let timer = null;
          if (req.botAfterMs) {
            timer = setTimeout(() => { es.close(); ok(null); }, req.botAfterMs);
          }
          setCancel(() => { es.close(); clearTimeout(timer); no(new Error('cancelled')); });
          es.onmessage = (e) => {
            const d = JSON.parse(e.data);
            if (d.t === 'waiting') onState({ text: d.people > 1 ? 'Looking for another player…' : 'Nobody else is waiting yet. Looking…' });
            if (d.t === 'paired') { clearTimeout(timer); es.close(); ok(d); }
          };
          es.onerror = () => { if (es.readyState === EventSource.CLOSED) { clearTimeout(timer); no(new Error('the lobby closed the queue: try again')); } };
        });
        if (!paired) {
          // nobody came: a bot game, with one this browser can run; Cancel still stops it until the game has started
          let stopped = false;
          let stop;
          const halted = new Promise((_, no) => { stop = no; });
          halted.catch(() => undefined);
          setCancel(() => { stopped = true; stop(new Error('cancelled')); });
          await Promise.race([loadEngine(), halted]);
          const runnable = info.bots.filter((b) => !unavailable(b));
          const bot = runnable[Math.floor(Math.random() * runnable.length)] ?? info.bots[0];
          onState({ text: `Nobody came: you play ${bot.title || bot.name}.` });
          const g = await startBot(bot.name, req.deck, RANDOM, () => !stopped);
          setCancel(() => undefined);
          return { ...g, opponent: bot.name };
        }
        return lobbyGame({ room: paired.room, side: paired.side, k: paired.k, peer: paired.peer }, paired.side, req.deck, onState, setCancel);
      }
      if (req.how === 'direct') return directHost(req.deck, onState, (fn) => { answerFn = fn; }, setCancel);
      throw new Error(`no way to pair: ${req.how}`);
    })();
    pairing++;
    done.finally(() => { pairing--; }).catch(() => undefined);
    return {
      done,
      cancel: () => { cancelled = true; cancel(); },
      answer: (code) => answerFn?.(code)
    };
  }

  /** stopped rejects when pairing is cancelled, which also closes pc; started() turns Cancel off once the game started. */
  function stopper(pc, setCancel) {
    let stop;
    let halted = false;
    const stopped = new Promise((_, no) => { stop = no; });
    stopped.catch(() => undefined);
    setCancel(() => { halted = true; try { pc.close(); } catch { /* gone */ } stop(new Error('cancelled')); });
    return { stopped, wanted: () => !halted, started: () => setCancel(() => undefined) };
  }

  /** Runs a pasted-code pairing; when it fails (a timeout, a bad code, a refused game) the peer connection closes. */
  async function linkUp(pc, run) {
    try {
      return await run();
    } catch (e) {
      try { pc.close(); } catch { /* gone */ }
      throw e;
    }
  }

  async function directHost(deck, onState, setAnswer, setCancel) {
    loadEngine().catch(() => undefined);
    const pc = new RTCPeerConnection({ iceServers: STUN });
    const dc = pc.createDataChannel('swu', { ordered: true });
    const { stopped, started, wanted } = stopper(pc, setCancel);
    // any failure before the game starts closes the peer connection, so no late peer reaches a page that gave up
    return linkUp(pc, async () => {
      await pc.setLocalDescription(await pc.createOffer());
      onState({ text: 'Making your code…' });
      await gathered(pc, 5000);
      const code = await pack({ v: 1, sdp: pc.localDescription.sdp, pid: info.you }, OFFER);
      const answered = new Promise((ok) => setAnswer(ok));
      onState({ text: 'Send this code to your friend (any chat works). Then paste the code they send back.', code, askCode: 'Their answer code' });
      const ans = await unpackCode(await Promise.race([answered, stopped]), ANSWER);
      onState({ text: `Connecting to ${ans.pid}…`, code: null });
      await pc.setRemoteDescription({ type: 'answer', sdp: ans.sdp });
      try {
        await Promise.race([opened(dc, 15000), stopped]);
      } catch (e) {
        if (e.message === 'cancelled') throw e;
        throw new Error('the two browsers could not reach each other directly; use an invite link instead (it can go through the lobby)');
      }
      const link = channelLink(pc, dc);
      const game = await Promise.race([hostGame(link, ans.pid, deck, null, wanted), stopped]);
      started();
      status(`Playing ${ans.pid}, linked directly.`, 'good');
      return game;
    });
  }

  async function directJoin(text, deck, onState, setCancel) {
    const offer = await unpackCode(text, OFFER);
    const pc = new RTCPeerConnection({ iceServers: STUN });
    const { stopped, started } = stopper(pc, setCancel);
    return linkUp(pc, async () => {
      let dc = null;
      const got = new Promise((ok) => { pc.ondatachannel = (e) => { dc = e.channel; ok(); }; });
      await pc.setRemoteDescription({ type: 'offer', sdp: offer.sdp });
      await pc.setLocalDescription(await pc.createAnswer());
      onState({ text: 'Making your answer code…' });
      await gathered(pc, 5000);
      const code = await pack({ v: 1, sdp: pc.localDescription.sdp, pid: info.you }, ANSWER);
      onState({ text: `Send this answer code back to ${offer.pid}. The game starts when they paste it.`, code });
      await Promise.race([got, stopped, new Promise((_, no) => setTimeout(() => no(new Error('your friend did not connect within 5 minutes')), 300000))]);
      await Promise.race([opened(dc, 30000), stopped]);
      const link = channelLink(pc, dc);
      const game = await Promise.race([guestGame(link, offer.pid, deck), stopped]);
      started();
      status(`Playing ${offer.pid}, linked directly.`, 'good');
      return game;
    });
  }

  // ---------------------------------------------------------------- the table Holotable plays through
  let joinCode = (() => {
    const m = /(?:^#|&)join=([A-Za-z0-9]{6})\b/.exec(location.hash);
    return m ? m[1].toUpperCase() : null;
  })();
  // an invite link opened in a tab that already shows the tables changes only the address's #: start over with it
  window.addEventListener('hashchange', () => {
    if (/(?:^#|&)join=[A-Za-z0-9]{6}\b/.test(location.hash) && !playing) location.reload();
  });
  /** A game against a bot in this tab; wanted() false before the game starts stops it (a cancelled lobby fallback). */
  async function startBot(name, deck, botDeck, wanted = () => true) {
    let bot = byName(name);
    const why = bot ? unavailable(bot) : `no bot named ${name}`;
    if (why) throw new Error(why);
    let release = () => undefined;
    pressed++;
    try {
      status(`Getting ${titleOf(bot)} ready…`, 'busy');
      await filesReady();
      if (!wanted()) throw new Error('cancelled');
      bot = byName(name) ?? bot;
      // its files keep coming while it starts, whatever the screen stops looking at
      release = want(bot);
      const eng = await loadEngine();
      await Promise.all(filesOf(bot).map((it) => load(it).promise));
      if (!wanted()) throw new Error('cancelled');
      const files = await readyBot(eng, bot);
      if (!wanted()) throw new Error('cancelled');
      const early = [];
      let g = null;
      eng.handlers.msg = (m) => (g ? deliver(g, m) : early.push(m));
      const st = await eng.start({ mode: 'bot', bot: bot.name, deck: deckRef(deck), botDeck: deckRef(botDeck), you: info.you }, files ?? undefined);
      // the worker keeps the models once a game has started with them: this tab lets go of its copy
      if (files) {
        tab.sent.add('jepa');
        for (const f of bot.files) tab.bytes.delete(f.url);
      }
      g = newGame(st.id, st.seat, 'bot');
      g.act = (act) => eng.act(act);
      g.concede = () => eng.concede();
      for (const m of early) deliver(g, m);
      if (!wanted()) {
        // cancelled while the worker dealt: end it there (the table takes one game at a time), and keep nothing
        g.cancelled = true;
        eng.concede();
        throw new Error('cancelled');
      }
      playing = true;
      progress(null);
      status(`Playing ${titleOf(bot)}. The game runs in this tab.`, 'good');
      return { id: st.id, seat: st.seat };
    } catch (e) {
      if (String(e?.message) !== 'cancelled') status(`${titleOf(bot)} did not start: ${String(e?.message || e)}`, 'bad');
      throw e;
    } finally {
      pressed--;
      release();
    }
  }
  const table = {
    options: async () => ({
      bots: info.bots.map((b) => b.name),
      botInfo: Object.fromEntries(info.bots.map((b) => [b.name, {
        title: titleOf(b), owner: b.owner, elo: b.elo, note: noteOf(b), bytes: sum(filesOf(b).filter((x) => !shared(x.url))) || null, unavailable: unavailable(b), featured: b.kind === 'jepa'
      }])),
      decks: [...info.decks, ...custom.map(optionOf)],
      botDeck: RANDOM,
      // /tables?bot=<name> (and the old /play?bot=<name>) opens on that opponent
      bot: (() => { const w = new URLSearchParams(location.search).get('bot'); return w && byName(w) ? w : null; })(),
      people: info.people,
      importDeck: true,
      you: info.you,
      join: (() => { const j = joinCode; joinCode = null; return j; })(),
      notice: 'Every game here runs in a player\'s browser and is unrated. Finished games are kept for training under your random player id, and anyone signed in with GitHub can read them.'
    }),
    importDeck: async (text) => {
      const { deck } = await api('POST', '/api/tables/deck', { text });
      // the engine checks it against the card data once it is loaded; a broken list is refused when a game starts
      let name = deck.metadata.name;
      const taken = new Set([...info.decks.map((d) => d.name), ...custom.map((d) => d.metadata.name)]);
      for (let i = 2; taken.has(name); i++) name = `${deck.metadata.name} (${i})`;
      deck.metadata.name = name;
      if (engine) {
        const eng = await engine;
        await eng.checkDeck(deck);
      }
      custom = [...custom, deck];
      saveCustom();
      return optionOf(deck);
    },
    prepare(name, onPrep) {
      const bot = byName(name);
      if (!bot || unavailable(bot)) {
        onPrep({ ready: false, left: null, total: null });
        return () => undefined;
      }
      loadEngine().catch(() => undefined);
      let stopped = false;
      // the bot's own files once the page knows them (after the games machine woke up, when it was asleep)
      let release = info.ready ? want(bot) : null;
      if (!release) {
        filesReady().then(() => {
          if (!stopped && byName(name)) release = want(byName(name));
        }, () => undefined);
      }
      const tell = () => onPrep(prepOf(byName(name) ?? bot));
      watchers.add(tell);
      tell();
      return () => {
        stopped = true;
        watchers.delete(tell);
        release?.();
      };
    },
    start: (bot, deck, botDeck) => startBot(bot, deck, botDeck),
    act: (id, act) => games.get(id)?.act(act) ?? Promise.reject(new Error('no such game')),
    concede: (id) => {
      games.get(id)?.concede();
      return Promise.resolve({ ok: true });
    },
    follow(id, onMsg, onError) {
      const g = games.get(id);
      if (!g) {
        onError(true);
        return () => undefined;
      }
      const sub = { onMsg, onError };
      for (const m of g.msgs) onMsg(m);
      g.subs.add(sub);
      return () => g.subs.delete(sub);
    },
    replayUrl: (id) => games.get(id)?.url ?? null,
    watch: (id) => (games.get(id)?.replay ? () => { backTo = 'table'; watch(games.get(id).replay); } : null),
    pair,
    note: 'Play anyone: a friend, whoever is in the lobby, or any arena bot. The real rules engine runs in a player\'s browser and downloads while you choose.',
    missing: 'Reload the page to try again.'
  };

  // ---------------------------------------------------------------- start
  async function main() {
    if (!window.SWUViewer?.mountPlay) {
      status('The page did not load completely. Reload it.', 'bad');
      return;
    }
    try {
      info = await api('GET', '/api/tables/info');
    } catch (e) {
      status(`The arena did not answer: ${e.message}`, 'bad');
      return;
    }
    $('who').textContent = `@${info.login} · ${info.you}`;
    if (!info.ready && !info.waking) {
      // a window that cannot serve the game files at all (no helper token) says why
      status(info.why || 'The game files are not here.', 'bad');
      return;
    }
    show('table');
    // a person who may play only the bots gets the bot screen alone (info.people is empty)
    if (!info.people.length) table.note = BOTS_NOTE;
    const joining = !!joinCode;
    mounted = SWUViewer.mountPlay($('table'), { table });
    if (info.ready) status(info.people.length ? 'Pick a way to play, an opponent and your deck.' : 'Pick your opponent and your deck.', 'idle');
    // a game needs the engine (a guest's does not: it draws the host's game), so it downloads while the person chooses
    if (joining) return;
    loadEngine().then(() => {
      if (!playing) status(`${info.people.length ? 'Pick a way to play, an opponent and your deck.' : 'Pick your opponent and your deck.'} The rules engine is loaded.`, 'good');
    }, (e) => status(`The rules engine did not load: ${String(e?.message || e)}`, 'bad'));
  }
  main();
})();
</script>
</body>
