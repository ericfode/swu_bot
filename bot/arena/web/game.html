<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--META-->
<style>
/* A game link's page (bot/arena/gamelinks.js): one game's replay in Holotable's viewer, for anyone holding the link, with
   no sign-in. ?step=<n> opens at decision n; the address follows the reader, so Copy link always gives where they are. */
:root {
  --bg: #060a13; --panel: #0f1829; --line: #1d2a44; --ink: #e6ecf8; --dim: #8494b8; --gold: #f6c454; --p1: #56c8ff; --p2: #ff5f6d;
  --sans: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --display: "Oxanium", "Eurostile", "Segoe UI", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 var(--sans); }
.bar { position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 10px 16px; border-bottom: 1px solid var(--line); background: color-mix(in oklab, var(--panel) 88%, transparent); backdrop-filter: blur(8px); }
.brand { font: 600 12px/1 var(--mono); letter-spacing: .2em; text-transform: uppercase; color: var(--dim); text-decoration: none; }
.title { font: 650 17px/1.2 var(--display); min-width: 0; overflow-wrap: anywhere; }
.grow { flex: 1; }
button { font: 600 14px/1 var(--sans); color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 9px 12px; cursor: pointer; }
button:hover { border-color: color-mix(in oklab, var(--p1) 50%, var(--line)); }
button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#viewer-wrap { padding: 12px 16px 24px; }
#viewer { min-height: calc(100dvh - 120px); }
.note { padding: 0 16px 24px; color: var(--dim); font-size: 13px; }
.note a { color: var(--dim); }
.msg { max-width: 560px; margin: 12vh auto 0; padding: 0 16px; color: var(--dim); }
@media (max-width: 560px) {
  .bar { padding: 8px 12px; gap: 4px 10px; }
  .title { flex-basis: 100%; order: 5; font-size: 15px; }
  #viewer-wrap { padding: 8px 0 16px; }
}
</style>
</head>
<body>
<div class="bar">
  <a class="brand" href="/">SWU Arena</a>
  <span class="title" id="title"></span>
  <span class="grow"></span>
  <button id="copy" type="button">Copy link</button>
  <button id="send" type="button" hidden>Send</button>
</div>
<div id="viewer-wrap"><div id="viewer"></div></div>
<p class="note">A replay shared from the SWU Arena: bots playing Star Wars Unlimited on the real rules engine. The link opens this game only. Press <b>?</b> for the viewer's keys.</p>
<script src="/g/kit.js"></script>
<script>
(() => {
  'use strict';
  const G = "__GAME__"; // {key, title}, filled in by the window
  const $ = (id) => document.getElementById(id);
  $('title').textContent = G.title || '';
  const params = new URLSearchParams(location.search);
  const stepN = Number(params.get('step')) || 0;
  if (!window.SWUViewer) {
    $('viewer').innerHTML = '<p class="msg">The viewer did not load. Reload the page to try again.</p>';
    return;
  }
  // the address follows the decision on screen, so the address bar and Copy link both give this spot in the game
  let at = stepN;
  let t = 0;
  const here = () => `${location.origin}${location.pathname}${at ? `?step=${at}` : ''}`;
  const follow = (n) => {
    at = n;
    clearTimeout(t);
    t = setTimeout(() => { try { history.replaceState(null, '', here()); } catch {} }, 400);
  };
  SWUViewer.mount($('viewer'), { url: `/g/${G.key}/game.jsonl`, follow: true, keyboard: 'window', persist: 'swuarena.gamelink', ...(stepN ? { stepN } : {}), onStep: (i, n) => follow(n) });
  $('copy').onclick = async () => {
    try { await navigator.clipboard.writeText(here()); $('copy').textContent = 'Copied'; }
    catch { window.prompt('Copy this link', here()); }
    setTimeout(() => { $('copy').textContent = 'Copy link'; }, 2000);
  };
  if (navigator.share) {
    $('send').hidden = false;
    $('send').onclick = () => navigator.share({ title: `${G.title} · SWU Arena`, url: here() }).catch(() => undefined);
  }
})();
</script>
</body>
</html>
