# The Fly app swu-arena-games: the games machine (Dockerfile.games). It plays the bots people submit on the window
# (swu-arena, fly.toml) and sends the results there. Deployed by .github/workflows/deploy-games.yml. The arena server's
# games role runs it (server/src/main-games.ts, server/README.md "The games machine"); it calls Node
# (bot/arena/gamesctl.js) for the arena's other work.
#
# It has a private address only (`fly ips allocate-v6 --private -a swu-arena-games`, no public IP), so only machines in
# the same Fly organization reach it: the window calls http://swu-arena-games.flycast/wake (ARENA_GAMES_WAKE in
# fly.toml) on each submission and every 6 hours, and Fly's proxy starts the stopped machine for that request. The
# server exits when it has had nothing to do for GAMES_IDLE_MIN minutes (10), and the machine stays stopped until the
# next wake-up (restart only on failure). The other settings it reads, with their defaults, are in server/README.md.
# Secret (`fly secrets set ... -a swu-arena-games`): SWU_WINDOW_TOKEN, a token the window accepts as the project's
# (ARENA_GAMES_TOKEN in fly.toml's secrets); GAMES_HELPER_TOKENS turns the helper API on (bot/arena/HELPER.md).
app = "swu-arena-games"
primary_region = "dfw"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile.games"
  ignorefile = "Dockerfile.games.dockerignore"

[env]
  SWU_WINDOW = "https://swu-arena.fly.dev"
  GAMES_DATA = "/data"
  PORT = "8080"
  # the server refuses to start when /data is not the volume (its rounds and state would not survive a restart)
  GAMES_REQUIRE_MOUNT = "1"
  # the helper API (bot/arena/HELPER.md), on the machine's private address; it stays off until the GAMES_HELPER_TOKENS
  # secret names a helper (`sh bot/arena/ops/helper.sh init`). Helpers reach it through `fly proxy` over the private
  # network only, so it needs no [[services]] entry.
  GAMES_HELPER_PORT = "8090"

[[mounts]]
  source = "games_data"
  destination = "/data"
  initial_size = "3gb"

# flycast only: reached at swu-arena-games.flycast over the private network, never from the internet
[[services]]
  internal_port = 8080
  protocol = "tcp"
  auto_start_machines = true
  # the server decides when to stop (a round has no requests while it plays)
  auto_stop_machines = "off"
  min_machines_running = 0

  [[services.ports]]
    port = 80
    handlers = ["http"]

  # it checks nothing but that the server answers, which it does from boot on, before setup and the warm-up end
  [[services.http_checks]]
    grace_period = "60s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[restart]]
  policy = "on-failure"
  retries = 3

[[vm]]
  size = "performance-2x"
  memory = "4gb"
