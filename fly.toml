# The Fly app swu-arena: the arena window today (bot/arena/window.js), the whole arena in phase B.
# Deployed by .github/workflows/deploy-arena.yml on every merge to main that touches the image (Dockerfile).
# Secrets (set with `fly secrets set ... -a swu-arena`): ARENA_PUSH_TOKEN (the project's push token; the same value
# is the cloud environment's network secret for swu-arena.fly.dev), GITHUB_CLIENT_ID and GITHUB_CLIENT_SECRET (the
# GitHub OAuth App for sign-in), ARENA_GAMES_TOKEN (the games machine's own project token, the same value as its
# SWU_WINDOW_TOKEN; fly.games.toml), optionally ARENA_ADMIN_TOKEN and ARENA_INVITES.
app = "swu-arena"
primary_region = "dfw"

[build]
  dockerfile = "Dockerfile"

[env]
  ARENA_ID = "v2"
  ARENA_MODE = "window"
  WINDOW_HOME = "/data/window"
  ARENA_PUBLIC_URL = "https://swu-arena.fly.dev"
  ARENA_ADMINS = "ericfode"
  # who may sign in with GitHub (bot/arena/auth.js): anyone with a GitHub account (Eric 18:32 2026-10-16, "make it so
  # that anyone with a github can sign up for the arena"); invited people also join the swarm. 'invited' closes it again.
  # Limits on what each person enters are in bot/arena/window.js (ARENA_BOTS_PER_PERSON, ARENA_OUTSIDE_BOTS,
  # ARENA_SUBMITS_PER_DAY), and the Share page blocks one login.
  ARENA_SIGNIN = "github"
  # the play page (/tables, bot/arena/tables.js): anyone signed in with GitHub may play the bots and other people, since
  # every game runs in a player's browser (Eric, 23:02 2026-10-15 for the bots; 19:28 2026-10-16 for both: "anyone should
  # be able to do either, as the bots run in the clients browser")
  ARENA_PLAY = "github"
  ARENA_TABLES = "github"
  # the games machine (fly.games.toml): woken over Fly's private network on every submission and every 6 hours
  ARENA_GAMES_WAKE = "http://swu-arena-games.flycast/wake"

[[mounts]]
  source = "arena_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
